<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tug of War</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --p1:#e04848; --p2:#2563eb; --ground:#c9b27a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --p1:#ff6b6b; --p2:#5b9bff; --ground:#7a6a45;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center}
  header{width:100%;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;align-items:center;gap:12px}
  h1{font-size:16px;margin:0;font-weight:600}
  .muted{color:var(--muted);font-size:13px;margin-left:auto}

  .screen{width:100%;max-width:900px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:20px}
  .hidden{display:none !important}

  /* --- menu --- */
  .modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .modeCard{width:220px;padding:20px;border:2px solid var(--border);border-radius:14px;background:var(--panel);
    cursor:pointer;text-align:center;transition:transform .15s,border-color .15s}
  .modeCard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .modeCard .icon{font-size:40px;margin-bottom:8px}
  .modeCard h3{margin:0 0 6px;font-size:15px}
  .modeCard p{margin:0;color:var(--muted);font-size:12.5px}

  .diffRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .diffRow button{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .diffRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* --- game --- */
  .countdown{font-size:64px;font-weight:800;color:var(--accent)}

  .arena{width:100%;display:flex;flex-direction:column;gap:10px}
  .labels{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
  .labels .p1{color:var(--p1)} .labels .p2{color:var(--p2)}

  .track{position:relative;width:100%;height:70px;background:var(--ground);border-radius:12px;overflow:hidden;
    border:1px solid var(--border)}
  .zone{position:absolute;top:0;bottom:0;width:8%;background:repeating-linear-gradient(45deg,rgba(0,0,0,.15) 0 6px,transparent 6px 12px)}
  .zone.left{left:0}
  .zone.right{right:0}
  .midline{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(0,0,0,.3);transform:translateX(-1px)}
  .rope{position:absolute;top:50%;left:0;right:0;height:6px;background:#8b5a2b;transform:translateY(-3px)}
  .knot{position:absolute;top:50%;width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:#fff3;border:3px solid #fff;transform:translate(-50%,-50%);transition:left .05s linear}

  .powerRow{display:flex;gap:14px}
  .powerBox{flex:1;display:flex;flex-direction:column;gap:4px}
  .powerBox .name{font-size:12px;color:var(--muted)}
  .powerBar{height:14px;border-radius:7px;background:var(--border);overflow:hidden}
  .powerBar > i{display:block;height:100%;border-radius:7px;transition:width .08s linear}
  .powerBar.p1 > i{background:var(--p1)}
  .powerBar.p2 > i{background:var(--p2)}

  .hint{color:var(--muted);font-size:13px;text-align:center}
  .mashBtn{padding:22px 0;width:100%;max-width:340px;border-radius:16px;border:2px solid var(--border);
    background:var(--panel);color:var(--text);font-size:20px;font-weight:800;cursor:pointer;user-select:none}
  .mashBtn:active{transform:scale(.97)}

  .result{font-size:26px;font-weight:800;text-align:center}
  .result.win{color:#1a7f3c}
  .result.lose{color:#c03a3a}
  .actions{display:flex;gap:10px}
  .actions button{padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:14px}
  .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>

<header>
  <h1>🪢 Tug of War</h1>
  <span class="muted" id="topHint">Bấm phím thật nhanh để kéo dây về phía bạn!</span>
</header>

<div class="screen">

  <!-- MENU: chọn mode -->
  <div id="menuScreen">
    <div class="modes">
      <div class="modeCard" id="pick2p">
        <div class="icon">🧑‍🤝‍🧑</div>
        <h3>2 người</h3>
        <p>Chung bàn phím<br>P1: <b>A</b> / <b>D</b> &nbsp;·&nbsp; P2: <b>←</b> / <b>→</b></p>
      </div>
      <div class="modeCard" id="pickAi">
        <div class="icon">🤖</div>
        <h3>Đấu với máy</h3>
        <p>Bạn dùng phím <b>Space</b> hoặc bấm nút<br>Máy tự bash theo độ khó</p>
      </div>
    </div>

    <div id="diffPick" class="hidden" style="display:flex;flex-direction:column;gap:10px;align-items:center">
      <div class="hint">Chọn độ khó AI:</div>
      <div class="diffRow">
        <button data-diff="easy">Dễ</button>
        <button data-diff="normal" class="active">Thường</button>
        <button data-diff="hard">Khó</button>
      </div>
      <button class="actions primary" id="startAi" style="padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600">Bắt đầu</button>
    </div>
  </div>

  <!-- COUNTDOWN -->
  <div id="countdownScreen" class="hidden">
    <div class="countdown" id="countdownNum">3</div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="hidden" style="width:100%">
    <div class="arena">
      <div class="labels">
        <span class="p1" id="p1Label">🔴 P1</span>
        <span class="p2" id="p2Label">🔵 P2</span>
      </div>
      <div class="track">
        <div class="zone left"></div>
        <div class="zone right"></div>
        <div class="midline"></div>
        <div class="rope"></div>
        <div class="knot" id="knot">🪢</div>
      </div>
      <div class="powerRow">
        <div class="powerBox">
          <span class="name">Tốc độ bash P1</span>
          <div class="powerBar p1"><i id="p1Power" style="width:0%"></i></div>
        </div>
        <div class="powerBox">
          <span class="name">Tốc độ bash P2</span>
          <div class="powerBar p2"><i id="p2Power" style="width:0%"></i></div>
        </div>
      </div>
      <div class="hint" id="gameHint">P1: A / D &nbsp;·&nbsp; P2: ← / →</div>
      <div style="display:flex;justify-content:center;gap:10px">
        <button class="mashBtn hidden" id="mashBtn">BASH!</button>
      </div>
      <div style="display:flex;justify-content:center">
        <button id="btnQuit" style="padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;font-size:13px">Thoát</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="result" id="resultText">P1 thắng!</div>
    <div class="actions">
      <button class="primary" id="btnReplay">Chơi lại</button>
      <button id="btnMenu">Về menu</button>
    </div>
  </div>

</div>

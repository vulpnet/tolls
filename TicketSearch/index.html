<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra Vé Xe/Tàu/Máy Bay</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:16px}

  .disclaimer{padding:10px 14px;border-radius:8px;background:rgba(37,99,235,.08);border:1px solid var(--border);
    color:var(--muted);font-size:12px}

  .tabRow{display:flex;gap:6px}
  .tabRow button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=text], input[type=date]{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:14px}

  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1;min-width:150px}

  .swapBtn{padding:10px;border:1px solid var(--border);border-radius:50%;background:var(--panel);
    color:var(--accent);cursor:pointer;font-size:16px;width:40px;height:40px;display:flex;align-items:center;
    justify-content:center;align-self:flex-end;margin-bottom:2px}
  .swapBtn:hover{background:rgba(37,99,235,.1)}

  .section{display:none;flex-direction:column;gap:14px}
  .section.active{display:flex}

  .resultList{display:flex;flex-direction:column;gap:10px}
  .resultCard{padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
    display:flex;align-items:center;gap:14px}
  .resultCard .logo{font-size:24px;flex-shrink:0}
  .resultCard .info{flex:1;min-width:0}
  .resultCard .name{font-weight:700;font-size:14px}
  .resultCard .desc{color:var(--muted);font-size:12px;margin-top:2px}
  .resultCard a.goBtn{padding:8px 18px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);
    color:#fff;text-decoration:none;font-size:13px;font-weight:600;flex-shrink:0}
  .resultCard a.goBtn:hover{filter:brightness(1.08)}
  .resultCard.manual a.goBtn{background:var(--panel);color:var(--accent)}
  .resultCard .copyHint{font-size:11px;color:var(--muted);margin-top:4px}
  .resultCard .copyHint b{color:var(--text);font-family:ui-monospace,Consolas,monospace}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--border);
    border-radius:10px}
</style>
</head>
<body>

<header>
  <h1>🎫 Tra Vé Xe/Tàu/Máy Bay</h1>
</header>

<main>
  <div class="wrap">
    <div class="disclaimer">
      ℹ️ Tool này KHÔNG đặt vé hay xử lý thanh toán — chỉ sinh sẵn liên kết tìm kiếm/thông tin cần nhập,
      giúp mở nhanh đúng trang của các nền tảng đặt vé phổ biến để bạn tự thao tác đặt vé trên trang đó.
    </div>

    <div class="tabRow" id="tabRow">
      <button data-tab="flight" class="active">✈️ Máy bay</button>
      <button data-tab="train">🚆 Tàu hoả</button>
      <button data-tab="bus">🚌 Xe khách</button>
    </div>

    <!-- FLIGHT -->
    <div class="section active" id="flightSection">
      <div class="row">
        <div class="field"><label>Điểm đi (mã sân bay)</label><input type="text" id="flightFrom" list="airportList" placeholder="Chọn hoặc gõ..." autocomplete="off"></div>
        <button class="swapBtn" id="flightSwap" title="Đổi chiều">⇄</button>
        <div class="field"><label>Điểm đến (mã sân bay)</label><input type="text" id="flightTo" list="airportList" placeholder="Chọn hoặc gõ..." autocomplete="off"></div>
      </div>
      <div class="row">
        <div class="field"><label>Ngày đi</label><input type="date" id="flightDate"></div>
      </div>
      <button class="act" id="btnSearchFlight" style="padding:10px 20px;border:1px solid var(--border);border-radius:8px;
        background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px;align-self:flex-start">Tìm chuyến bay</button>
      <div class="resultList" id="flightResults"></div>
    </div>

    <!-- TRAIN -->
    <div class="section" id="trainSection">
      <div class="row">
        <div class="field"><label>Ga đi</label><input type="text" id="trainFrom" list="trainStationList" placeholder="Chọn hoặc gõ..." autocomplete="off"></div>
        <button class="swapBtn" id="trainSwap" title="Đổi chiều">⇄</button>
        <div class="field"><label>Ga đến</label><input type="text" id="trainTo" list="trainStationList" placeholder="Chọn hoặc gõ..." autocomplete="off"></div>
      </div>
      <div class="row">
        <div class="field"><label>Ngày đi</label><input type="date" id="trainDate"></div>
      </div>
      <button class="act" id="btnSearchTrain" style="padding:10px 20px;border:1px solid var(--border);border-radius:8px;
        background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px;align-self:flex-start">Tìm chuyến tàu</button>
      <div class="resultList" id="trainResults"></div>
    </div>

    <!-- BUS -->
    <div class="section" id="busSection">
      <div class="row">
        <div class="field"><label>Điểm đi</label><input type="text" id="busFrom" list="busCityList" placeholder="Chọn hoặc gõ..." autocomplete="off"></div>
        <button class="swapBtn" id="busSwap" title="Đổi chiều">⇄</button>
        <div class="field"><label>Điểm đến</label><input type="text" id="busTo" list="busCityList" placeholder="Chọn hoặc gõ..." autocomplete="off"></div>
      </div>
      <div class="row">
        <div class="field"><label>Ngày đi</label><input type="date" id="busDate"></div>
      </div>
      <button class="act" id="btnSearchBus" style="padding:10px 20px;border:1px solid var(--border);border-radius:8px;
        background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px;align-self:flex-start">Tìm chuyến xe</button>
      <div class="resultList" id="busResults"></div>
    </div>
  </div>

  <!-- gợi ý combobox: input list="" + datalist cho phép chọn từ danh sách hoặc tự gõ giá trị khác
       không có trong danh sách (sân bay/ga/tỉnh thành nhỏ hơn không liệt kê hết được) -->
  <datalist id="airportList">
    <option value="SGN">TP. Hồ Chí Minh (SGN)</option>
    <option value="HAN">Hà Nội (HAN)</option>
    <option value="DAD">Đà Nẵng (DAD)</option>
    <option value="CXR">Nha Trang - Cam Ranh (CXR)</option>
    <option value="DLI">Đà Lạt (DLI)</option>
    <option value="PQC">Phú Quốc (PQC)</option>
    <option value="HUI">Huế (HUI)</option>
    <option value="VII">Vinh (VII)</option>
    <option value="VCA">Cần Thơ (VCA)</option>
    <option value="HPH">Hải Phòng (HPH)</option>
    <option value="UIH">Quy Nhơn (UIH)</option>
    <option value="TBB">Tuy Hòa (TBB)</option>
    <option value="VDH">Đồng Hới (VDH)</option>
    <option value="VDO">Vân Đồn (VDO)</option>

    <option value="CAH">Cà Mau (CAH)</option>
    <option value="DIN">Điện Biên Phủ (DIN)</option>
  </datalist>

  <datalist id="trainStationList">
    <option value="Sài Gòn">Ga Sài Gòn</option>
    <option value="Hà Nội">Ga Hà Nội</option>
    <option value="Đà Nẵng">Ga Đà Nẵng</option>
    <option value="Huế">Ga Huế</option>
    <option value="Nha Trang">Ga Nha Trang</option>
    <option value="Vinh">Ga Vinh</option>
    <option value="Thanh Hóa">Ga Thanh Hóa</option>
    <option value="Nam Định">Ga Nam Định</option>
    <option value="Ninh Bình">Ga Ninh Bình</option>
    <option value="Đồng Hới">Ga Đồng Hới</option>
    <option value="Quảng Ngãi">Ga Quảng Ngãi</option>
    <option value="Diêu Trì">Ga Diêu Trì (Quy Nhơn)</option>
    <option value="Tháp Chàm">Ga Tháp Chàm (Phan Rang)</option>
    <option value="Biên Hòa">Ga Biên Hòa</option>
    <option value="Vinh Trung">Ga Dĩ An</option>
  </datalist>

  <datalist id="busCityList">
    <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
    <option value="Hà Nội">Hà Nội</option>
    <option value="Đà Nẵng">Đà Nẵng</option>
    <option value="Đà Lạt">Đà Lạt</option>
    <option value="Nha Trang">Nha Trang</option>
    <option value="Vũng Tàu">Vũng Tàu</option>
    <option value="Cần Thơ">Cần Thơ</option>
    <option value="Huế">Huế</option>
    <option value="Hải Phòng">Hải Phòng</option>
    <option value="Quy Nhơn">Quy Nhơn</option>
    <option value="Phan Thiết">Phan Thiết</option>
    <option value="Buôn Ma Thuột">Buôn Ma Thuột</option>
    <option value="Cà Mau">Cà Mau</option>
    <option value="Rạch Giá">Rạch Giá</option>
    <option value="Mỹ Tho">Mỹ Tho</option>
    <option value="Long Xuyên">Long Xuyên</option>
    <option value="Sapa">Sapa</option>
    <option value="Hạ Long">Hạ Long</option>
    <option value="Ninh Bình">Ninh Bình</option>
    <option value="Vinh">Vinh</option>
  </datalist>
</main>

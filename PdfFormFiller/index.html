<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="pageTitle">Điền Form PDF</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a; --ok-text:#1a8a4a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0; --ok-text:#5fd08a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:16px}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;
    color:var(--muted);cursor:pointer;background:var(--panel)}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;color:var(--text);display:flex;gap:6px;align-items:center}
  .field label .type{color:var(--muted);font-size:11px;text-transform:uppercase}
  input[type=text], select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:13px}

  .chkRow{display:flex;align-items:center;gap:8px;font-size:13px}

  .formList{display:flex;flex-direction:column;gap:12px}

  .statusLine{font-size:13px;color:var(--muted)}
  .statusLine b.ok{color:var(--ok-text)}
  .statusLine b.err{color:var(--err-text)}

  button.act{padding:10px 20px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  .checkRow2{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--border);
    border-radius:10px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header><h1 data-i18n="headerTitle">📝 Điền Form PDF</h1></header>

<main>
  <div class="wrap">

    <div class="dropzone" id="dropzone" data-i18n="dropzone">📄 Kéo-thả 1 file PDF có sẵn ô nhập (AcroForm) vào đây, hoặc bấm để chọn
      <input type="file" id="fileInput" accept=".pdf" style="display:none">
    </div>
    <div class="statusLine" id="fileStatus"></div>

    <div class="hint" data-i18n="hintText">Chỉ hoạt động với file PDF đã có sẵn field điền (AcroForm — thường thấy ở biểu mẫu/tờ khai được tạo bằng Acrobat/Word xuất PDF form). Nếu PDF không có field nào, công cụ sẽ báo rõ thay vì crash.</div>

    <div id="formArea"></div>

    <div class="checkRow2" id="flattenRow" style="display:none">
      <input type="checkbox" id="flattenChk">
      <label for="flattenChk" data-i18n="flattenLabel">Khoá lại sau khi điền (flatten — không sửa được nữa, chỉ xem, an toàn khi gửi đi)</label>
    </div>

    <button class="act primary" id="btnExport" style="display:none" disabled data-i18n="btnExport">💾 Xuất PDF đã điền</button>
    <div class="statusLine" id="exportStatus"></div>
  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF to Text/Image</title>
<script src="pdf.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act:disabled{opacity:.5;cursor:default}

  .dropzone{margin:12px 18px;border:2px dashed var(--border);border-radius:10px;padding:24px;
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06);color:var(--accent)}
  .dropzone input{display:none}
  .fileName{font-weight:600;color:var(--text)}

  main{flex:1;overflow:auto;padding:0 18px 18px}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .err{padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px}

  textarea#textOut{width:100%;height:60vh;padding:12px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace;resize:vertical}

  .pageGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .pageCard{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px;
    border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  .pageCard img{max-width:100%;border-radius:4px;border:1px solid var(--border)}
  .pageCard .pnum{font-size:12px;color:var(--muted)}
  .pageCard button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:12px}

  .progressWrap{margin:0 18px 12px;display:none;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  .progressWrap.show{display:flex}
  .progressBar{flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden}
  .progressBar > i{display:block;height:100%;background:var(--accent);width:0%;transition:width .15s}
</style>
</head>
<body>

<header>
  <h1>📄 PDF → Text/Image</h1>
  <div class="tabs">
    <button id="tabText" class="active">Trích Text</button>
    <button id="tabImage">Xuất ảnh từng trang</button>
  </div>
  <div class="actions">
    <button class="act" id="btnCopyText" disabled>Copy text</button>
    <button class="act" id="btnClear">Xoá</button>
  </div>
</header>

<div class="dropzone" id="dropzone">
  <span id="dzText">Kéo thả file PDF vào đây, hoặc bấm để chọn file</span>
  <span class="fileName" id="fileName"></span>
  <input type="file" id="fileInput" accept="application/pdf">
</div>

<div class="progressWrap" id="progressWrap">
  <span id="progressLabel">Đang xử lý...</span>
  <div class="progressBar"><i id="progressBarInner"></i></div>
  <span id="progressPct">0%</span>
</div>

<main>
  <div id="output"><div class="empty">Chưa có dữ liệu — chọn file PDF để bắt đầu</div></div>
</main>

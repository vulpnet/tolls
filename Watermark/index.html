<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watermark Ảnh</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .layout{width:100%;max-width:1100px;display:grid;grid-template-columns:340px 1fr;gap:24px}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}

  .panel{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  textarea, input[type=text], input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);color:var(--text);font:13px -apple-system,Segoe UI,Roboto,sans-serif}

  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1;min-width:100px}
  select, input[type=color]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:13px}
  input[type=color]{padding:2px;height:36px;cursor:pointer}

  .sliderRow{display:flex;align-items:center;gap:10px}
  .sliderRow input[type=range]{flex:1}
  .sliderRow .val{width:52px;text-align:right;color:var(--muted);font-size:13px}

  .radioGroup{display:flex;gap:14px}
  .radioGroup label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;
    color:var(--muted);cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}
  .dropzone:hover, .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}
  .dropzone input{display:none}

  .posGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:120px}
  .posGrid button{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .posGrid button .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .posGrid button.active{border-color:var(--accent);background:rgba(37,99,235,.1)}
  .posGrid button.active .dot{background:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel);
    display:flex;flex-direction:column}
  .card canvas{width:100%;height:140px;object-fit:contain;background:repeating-conic-gradient(#0000 0% 25%, rgba(127,127,127,.08) 0% 50%) 50%/16px 16px}
  .card .meta{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .card .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cardActions{display:flex;gap:6px}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:60px 10px;border:1px dashed var(--border);
    border-radius:10px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.act{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act.small{padding:5px 10px;font-size:12px}
  button.act:disabled{opacity:.5;cursor:default}

  .hint{color:var(--muted);font-size:12px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
</style>
</head>
<body>

<header>
  <h1>💧 Watermark Ảnh</h1>
</header>

<main>
  <div class="layout">
    <div class="panel">
      <div class="field">
        <label>Ảnh nguồn</label>
        <div class="dropzone" id="dropzone">
          Kéo-thả ảnh vào đây, hoặc bấm để chọn (chọn được nhiều ảnh)
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        <div class="hint">Xử lý trên trình duyệt — tối đa 50 ảnh/lần, khuyến nghị mỗi ảnh dưới 20MB.</div>
      </div>

      <div class="field">
        <label>Kiểu watermark</label>
        <div class="radioGroup">
          <label><input type="radio" name="wmType" value="text" checked> Text</label>
          <label><input type="radio" name="wmType" value="logo"> Logo (ảnh)</label>
        </div>
      </div>

      <div id="textOpts">
        <div class="field">
          <label>Nội dung text</label>
          <input type="text" id="wmText" value="© Company" placeholder="Nhập text watermark">
        </div>
        <div class="row">
          <div class="field">
            <label>Màu chữ</label>
            <input type="color" id="wmColor" value="#ffffff">
          </div>
          <div class="field">
            <label>Cỡ chữ (% chiều rộng ảnh)</label>
            <input type="number" id="wmFontPct" value="5" min="1" max="30" step="0.5">
          </div>
        </div>
      </div>

      <div id="logoOpts" style="display:none">
        <div class="field">
          <label>Ảnh logo</label>
          <input type="file" id="logoInput" accept="image/*">
        </div>
        <div class="field">
          <label>Kích thước logo (% chiều rộng ảnh)</label>
          <input type="number" id="logoPct" value="20" min="2" max="80" step="1">
        </div>
      </div>

      <div class="field">
        <label>Vị trí</label>
        <div class="posGrid" id="posGrid"></div>
      </div>

      <div class="field">
        <label>Độ mờ</label>
        <div class="sliderRow">
          <input type="range" id="opacityRange" min="5" max="100" value="60">
          <span class="val" id="opacityVal">60%</span>
        </div>
      </div>

      <div class="field">
        <label>Lề (px)</label>
        <input type="number" id="marginPx" value="20" min="0" max="200" step="5">
      </div>

      <div class="hint">Xử lý hoàn toàn trên trình duyệt, ảnh không upload lên đâu cả.</div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="hint" id="countHint">Chưa có ảnh nào</div>
        <div class="actions">
          <button class="act primary" id="btnDownloadAll" disabled>Tải tất cả</button>
          <button class="act" id="btnClear" disabled>Xoá hết</button>
        </div>
      </div>
      <div id="resultArea"><div class="empty">Thêm ảnh ở bên trái để xem trước watermark</div></div>
    </div>
  </div>
</main>

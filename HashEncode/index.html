<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hash & Encode</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}

  textarea{width:100%;height:110px;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:14px ui-monospace,Consolas,monospace;resize:vertical}

  .resultGrid{display:flex;flex-direction:column;gap:10px}
  .resultRow{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel)}
  .resultRow .head{display:flex;align-items:center;gap:8px}
  .resultRow .head b{font-size:13px}
  .resultRow .head button{margin-left:auto;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;padding:3px 10px;font-size:12px}
  .resultRow .val{font:13px ui-monospace,Consolas,monospace;word-break:break-all;color:var(--muted)}
  .err{color:var(--err-text);font-size:13px}

  .sectionTitle{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}

  .encodeRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.encodeRow{grid-template-columns:1fr}}
  .encodeRow .col{display:flex;flex-direction:column;gap:6px}
  .encodeRow textarea{height:120px}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">🔒 Hash & Encode</h1>
</header>

<main>
  <div class="wrap">
    <div>
      <p class="sectionTitle" data-i18n="sectionInput">Input</p>
      <textarea id="input" data-i18n="inputPlaceholder" placeholder="Nhập text để hash/encode..."></textarea>
    </div>

    <div>
      <p class="sectionTitle" data-i18n="sectionHash">Hash (một chiều, không giải mã ngược được)</p>
      <div class="resultGrid" id="hashResults"></div>
    </div>

    <div>
      <p class="sectionTitle" data-i18n="sectionBase64">Base64</p>
      <div class="resultRow">
        <div class="head"><b data-i18n="labelEncode">Encode</b><button data-copy-target="b64Encode" data-i18n="btnCopy">Copy</button></div>
        <div class="val" id="b64Encode">—</div>
      </div>
      <div class="resultRow" style="margin-top:8px">
        <div class="head"><b data-i18n="labelB64Decode">Decode (thử decode input như base64)</b><button data-copy-target="b64Decode" data-i18n="btnCopy">Copy</button></div>
        <div class="val" id="b64Decode">—</div>
      </div>
    </div>

    <div>
      <p class="sectionTitle" data-i18n="sectionUrl">URL Encode / Decode</p>
      <div class="resultRow">
        <div class="head"><b data-i18n="labelEncode">Encode</b><button data-copy-target="urlEncode" data-i18n="btnCopy">Copy</button></div>
        <div class="val" id="urlEncode">—</div>
      </div>
      <div class="resultRow" style="margin-top:8px">
        <div class="head"><b data-i18n="labelUrlDecode">Decode (thử decode input)</b><button data-copy-target="urlDecode" data-i18n="btnCopy">Copy</button></div>
        <div class="val" id="urlDecode">—</div>
      </div>
    </div>
  </div>
</main>

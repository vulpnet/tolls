<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Convert</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a;
    --key:#8250df; --str:#0a7d3c; --num:#0550ae; --bool:#c2410c; --null:#6b7280;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0;
      --key:#d2a8ff; --str:#7ee2a8; --num:#79c0ff; --bool:#ffa657; --null:#9aa4b2;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  label.opt{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  .actions{display:flex;gap:8px;margin-left:auto}
  .main{display:grid;grid-template-columns:var(--split,1fr) 6px 1fr;padding:12px 18px;height:calc(100vh - 64px)}
  .main > div{display:flex;flex-direction:column;gap:6px;min-height:0}
  .resizer{cursor:col-resize;position:relative;background:transparent}
  .resizer::after{content:'';position:absolute;top:0;bottom:0;left:2px;width:2px;background:var(--border)}
  .resizer:hover::after,.resizer.dragging::after{background:var(--accent)}
  .main h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;flex:1;resize:none;padding:10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);color:var(--text);
    font:13px/1.5 ui-monospace,Consolas,monospace}
  .out{flex:1;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:10px}
  pre.pretty{margin:0;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .k{color:var(--key)} .s{color:var(--str)} .n{color:var(--num)} .b{color:var(--bool)} .z{color:var(--null)}
  table{width:100%;border-collapse:collapse;font:13px/1.5 ui-monospace,Consolas,monospace;table-layout:auto}
  th,td{padding:5px 8px;border:1px solid var(--border);text-align:left;vertical-align:top;
    max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.wrap{white-space:pre-wrap;word-break:break-word}
  th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;position:sticky;top:0;
    white-space:nowrap;cursor:default}
  th .col-idx{color:var(--accent);font-weight:600;margin-right:4px}
  tr:nth-child(even) td{background:rgba(127,127,127,.05)}
  tr:hover td{background:rgba(37,99,235,.08)}
  td.rownum{width:1%;text-align:right;color:var(--muted);background:rgba(127,127,127,.07);user-select:none}
  .nestBtn{border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--accent);
    cursor:pointer;font:12px ui-monospace,Consolas,monospace;padding:2px 8px}
  .nestBtn:hover{filter:brightness(1.1)}
  .nestBtn.open{background:var(--accent);border-color:var(--accent);color:#fff}
  .nullval{color:var(--muted);font-style:italic}
  .table-wrap{overflow:auto;height:100%;cursor:grab;user-select:none}
  .table-wrap.panning{cursor:grabbing}
  tr.expand-row > td{padding:0;background:rgba(127,127,127,.06);max-width:none;overflow:visible;white-space:normal}
  .expand-inner{padding:8px 10px 8px 28px;border-left:3px solid var(--accent)}
  .expand-inner .sub-table-wrap{overflow:auto;max-height:320px;max-width:100%;cursor:grab;user-select:none}
  .expand-inner .sub-table-wrap.panning{cursor:grabbing}
  .expand-inner table{margin-top:2px;width:max-content;min-width:100%}
  .expand-inner pre{margin:0;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;
    justify-content:center;z-index:50}
  .detail-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    width:min(720px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .detail-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .detail-head b{font-size:13px}
  .detail-head button{margin-left:auto;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;padding:4px 10px;font-size:12px}
  .detail-body{padding:12px 14px;overflow:auto}
  .detail-body pre{margin:0;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .err{padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font:13px ui-monospace,Consolas,monospace}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  .notice{padding:8px 10px;margin-bottom:6px;background:var(--err-bg);color:var(--err-text);border-radius:6px;font-size:12px}
  @media (max-width:820px){.main{grid-template-columns:1fr;height:auto}.resizer{display:none}textarea{height:220px}}
</style>
</head>
<body>
<header>
  <h1>JSON Convert</h1>
  <div class="tabs">
    <button id="tabPretty" class="active">Pretty JSON</button>
    <button id="tabMin">Minify</button>
    <button id="tabTable">Table</button>
  </div>
  <label class="opt"><input type="checkbox" id="autoRun" checked> Auto convert</label>
  <div class="actions">
    <button class="act" id="btnRun">Convert</button>
    <button class="act" id="btnCopy">Copy kết quả</button>
    <button class="act" id="btnClear">Xoá</button>
  </div>
</header>

<div class="main" id="mainGrid">
  <div>
    <h2>Input (JSON string)</h2>
    <textarea id="input" placeholder='Paste JSON string vào đây, vd: {"name":"A","items":[1,2,3]}'></textarea>
  </div>
  <div class="resizer" id="resizer"></div>
  <div>
    <h2>Output</h2>
    <div class="out" id="output"><div class="empty">Chưa có dữ liệu</div></div>
  </div>
</div>

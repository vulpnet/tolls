<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Picker</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:18px}

  .pickRow{display:flex;gap:14px;align-items:center}
  input[type=color]{width:70px;height:70px;border:1px solid var(--border);border-radius:10px;cursor:pointer;padding:2px}
  .preview{flex:1;height:70px;border-radius:10px;border:1px solid var(--border)}

  .formats{display:flex;flex-direction:column;gap:8px}
  .formatRow{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel)}
  .formatRow .fname{width:60px;color:var(--muted);font-size:12px;text-transform:uppercase}
  .formatRow input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);
    color:var(--text);font:13px ui-monospace,Consolas,monospace}
  .formatRow button{border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);
    cursor:pointer;padding:5px 10px;font-size:12px}

  .paletteSection h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
  .paletteGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  .swatch{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .swatch .box{height:50px}
  .swatch .hex{padding:4px 6px;font:11px ui-monospace,Consolas,monospace;background:var(--panel);color:var(--muted);text-align:center}
</style>
</head>
<body>

<header>
  <h1>🎨 Color Picker</h1>
</header>

<main>
  <div class="wrap">
    <div class="pickRow">
      <input type="color" id="colorInput" value="#2563eb">
      <div class="preview" id="previewBox"></div>
    </div>

    <div class="formats">
      <div class="formatRow"><span class="fname">HEX</span><input type="text" id="fmtHex" readonly><button data-copy="fmtHex">Copy</button></div>
      <div class="formatRow"><span class="fname">RGB</span><input type="text" id="fmtRgb" readonly><button data-copy="fmtRgb">Copy</button></div>
      <div class="formatRow"><span class="fname">HSL</span><input type="text" id="fmtHsl" readonly><button data-copy="fmtHsl">Copy</button></div>
    </div>

    <div class="paletteSection">
      <h2>Bảng màu liên quan (Shades / Tints)</h2>
      <div class="paletteGrid" id="shadesGrid"></div>
    </div>

    <div class="paletteSection">
      <h2>Màu bổ sung (Complementary / Triadic)</h2>
      <div class="paletteGrid" id="harmonyGrid"></div>
    </div>
  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duplicate Finder</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --dup-bg:#fde8e8; --dup-text:#c03a3a; --uniq-bg:#e2f5e8;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --dup-bg:#3a1a1d; --dup-text:#f3b0b0; --uniq-bg:#12351f;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}

  label.chk{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;cursor:pointer}
  .actions{display:flex;gap:8px;margin-left:auto}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;min-height:0;padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;gap:6px;min-height:0}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;flex:1;resize:none;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace}

  .summary{color:var(--muted);font-size:13px;padding:2px 0}
  .summary b.dup{color:var(--dup-text)}

  .out{flex:1;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:6px}
  .lineRow{display:flex;gap:8px;padding:2px 6px;font:13px ui-monospace,Consolas,monospace;border-radius:4px;
    white-space:pre-wrap;word-break:break-word}
  .lineRow .ln{color:var(--muted);min-width:34px;text-align:right;user-select:none}
  .lineRow.dup{background:var(--dup-bg)}
  .lineRow.dup .ln{color:var(--dup-text)}
  .lineRow.uniq{background:var(--uniq-bg)}
  .empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>🔍 Duplicate Finder</h1>
  <label class="chk"><input type="checkbox" id="caseInsensitive"> Không phân biệt hoa/thường</label>
  <label class="chk"><input type="checkbox" id="trimLine" checked> Bỏ khoảng trắng đầu/cuối dòng</label>
  <label class="chk"><input type="checkbox" id="ignoreEmpty" checked> Bỏ qua dòng trống</label>
  <div class="actions">
    <button class="act" id="btnCopyDupOnly">Copy dòng trùng</button>
    <button class="act" id="btnCopyUniqOnly">Copy dòng duy nhất</button>
    <button class="act primary" id="btnRemoveDup">Xoá trùng (giữ 1 bản)</button>
    <button class="act" id="btnClear">Xoá tất cả</button>
  </div>
</header>

<main>
  <div class="panel">
    <h2>Input (mỗi dòng 1 mục để kiểm tra)</h2>
    <textarea id="input" placeholder="Dán danh sách vào đây, mỗi dòng 1 giá trị..."></textarea>
  </div>
  <div class="panel">
    <h2>Kết quả</h2>
    <div class="summary" id="summary"></div>
    <div class="out" id="output"><div class="empty">Chưa có dữ liệu</div></div>
  </div>
</main>

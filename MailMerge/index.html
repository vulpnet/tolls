<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail Merge</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  main{flex:1;min-height:0;padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;gap:8px;min-height:0}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;flex:1;resize:none;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace}
  .hint{color:var(--muted);font-size:12px}
  .fieldTags{display:flex;gap:6px;flex-wrap:wrap}
  .fieldTag{padding:3px 8px;border-radius:12px;background:rgba(37,99,235,.12);color:var(--accent);font-size:11.5px;
    font-family:ui-monospace,Consolas,monospace}
  .fieldTag.missing{background:var(--err-bg);color:var(--err-text)}

  .previewNav{display:flex;align-items:center;gap:10px}
  .previewNav button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .previewNav button:disabled{opacity:.4;cursor:default}
  .previewNav span{color:var(--muted);font-size:13px}

  .previewOut{flex:1;overflow:auto;padding:14px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);white-space:pre-wrap;word-break:break-word;font:14px/1.6 -apple-system,Segoe UI,Roboto,sans-serif}
  .empty{color:var(--muted);text-align:center;padding:24px}
  .err{padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px}

  .json-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;
    justify-content:center;z-index:50}
  .json-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    width:min(760px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .json-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .json-head b{font-size:13px}
  .json-head button{border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;padding:4px 10px;font-size:12px}
  .json-head .spacer{margin-left:auto}
  .json-body{padding:12px 14px;overflow:auto}
  .json-body pre{margin:0;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;user-select:text}
</style>
</head>
<body>

<header>
  <h1>✉️ Mail Merge</h1>
  <div class="actions">
    <button class="act" id="btnCopyCurrent" disabled>Copy bản hiện tại</button>
    <button class="act primary" id="btnExportAll" disabled>Xuất tất cả</button>
  </div>
</header>

<main>
  <div class="panel">
    <h2>Template (dùng {{TenCot}} để đánh dấu chỗ cần điền)</h2>
    <textarea id="template" placeholder="Kính gửi {{Ten}},&#10;&#10;Chúng tôi xác nhận đơn hàng {{MaDon}} của bạn đã được xử lý.&#10;&#10;Trân trọng."></textarea>
    <div class="fieldTags" id="fieldTags"></div>

    <h2 style="margin-top:8px">Dữ liệu (dán từ Excel — dòng đầu là tên cột)</h2>
    <textarea id="data" placeholder="Ten	MaDon&#10;Tài	DH001&#10;Vũ	DH002"></textarea>
    <div class="hint">Dán trực tiếp từ Excel/Google Sheets (Ctrl+V) — tự nhận diện dấu Tab hoặc phẩy làm dấu phân cách cột.</div>
  </div>

  <div class="panel">
    <h2>Xem trước</h2>
    <div class="previewNav">
      <button id="btnPrev" disabled>‹ Trước</button>
      <span id="previewPos">0 / 0</span>
      <button id="btnNext" disabled>Sau ›</button>
    </div>
    <div class="previewOut" id="previewOut"><div class="empty">Nhập template và dữ liệu để xem trước</div></div>
  </div>
</main>

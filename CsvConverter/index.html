<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text to CSV</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}

  .field{display:flex;align-items:center;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  select, input[type=text]{padding:6px 8px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);font-size:13px}
  input[type=text].delimInput{width:50px;font-family:ui-monospace,Consolas,monospace;text-align:center}
  label.chk{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;cursor:pointer}

  .actions{display:flex;gap:8px;margin-left:auto}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}

  main{flex:1;min-height:0;padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;gap:6px;min-height:0}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;flex:1;resize:none;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace}
  .out{flex:1;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
  table{border-collapse:collapse;width:max-content;min-width:100%;font:13px ui-monospace,Consolas,monospace}
  th,td{padding:5px 8px;border:1px solid var(--border);text-align:left;white-space:nowrap;max-width:280px;
    overflow:hidden;text-overflow:ellipsis}
  th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;position:sticky;top:0}
  tr:nth-child(even) td{background:rgba(127,127,127,.05)}
  .empty{padding:24px;text-align:center;color:var(--muted)}

  /* ---- Nút copy cột/hàng dùng chung (table-copy.js) — hiện khi hover th/rownum ---- */
  th, td.rownum, td.rowh{ position:relative }
  .tblCopyBtn{position:absolute;top:2px;right:2px;display:none;padding:1px 4px;font-size:11px;
    line-height:1.4;border:1px solid var(--border);border-radius:4px;background:var(--panel);
    color:var(--text);cursor:pointer}
  th:hover .tblCopyBtn, td.rownum:hover .tblCopyBtn, td.rowh:hover .tblCopyBtn{display:inline-block}
  .tblCopyBtn:hover{filter:brightness(1.15)}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
<script src="../assets/table-copy.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">📋 Text ↔ CSV/TSV</h1>
  <div class="field">
    <label data-i18n="delimiterLabel">Delimiter</label>
    <select id="delimSelect">
      <option value="\t" data-i18n="delimTab">Tab</option>
      <option value="," data-i18n="delimComma">Dấu phẩy (,)</option>
      <option value=";" data-i18n="delimSemicolon">Chấm phẩy (;)</option>
      <option value="|" data-i18n="delimPipe">Gạch đứng (|)</option>
      <option value="custom" data-i18n="delimCustom">Tuỳ chỉnh...</option>
    </select>
    <input type="text" id="customDelim" class="delimInput hidden" maxlength="3" data-i18n="customDelimPlaceholder" placeholder="vd: ::">
  </div>
  <label class="chk"><input type="checkbox" id="firstRowHeader" checked> <span data-i18n="firstRowHeader">Dòng đầu là header</span></label>
  <label class="chk"><input type="checkbox" id="trimCells" checked> <span data-i18n="trimCells">Xoá khoảng trắng thừa mỗi ô</span></label>
  <div class="actions">
    <button class="act" id="btnSwap" data-i18n="btnSwap">⇄ Đảo chiều</button>
    <button class="act" id="btnCopyOutput" data-i18n="btnCopyOutput">Copy kết quả</button>
    <button class="act" id="btnClear" data-i18n="btnClear">Xoá</button>
  </div>
</header>

<main>
  <div class="panel">
    <h2 data-i18n="inputPanelTitle">Input (text tách theo delimiter)</h2>
    <textarea id="input" data-i18n="inputPlaceholder" placeholder="Dán text vào đây, mỗi dòng 1 bản ghi, các cột cách nhau bằng delimiter đã chọn ở trên..."></textarea>
  </div>
  <div class="panel">
    <h2 data-i18n="outputPanelTitle">Xem trước dạng bảng</h2>
    <div class="out" id="output"><div class="empty" data-i18n="emptyData">Chưa có dữ liệu</div></div>
  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare Text</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --add-bg:#e2f5e8; --add-mark:#a6e6b8; --del-bg:#fde8e8; --del-mark:#f3b0b0;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --add-bg:#12351f; --add-mark:#1f6b39; --del-bg:#3a1a1d; --del-mark:#7d2c33;
      --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  label.opt{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
  button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:hover{filter:brightness(1.08)}
  .inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px}
  .inputs > div{display:flex;flex-direction:column;gap:6px}
  .inputs h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;height:190px;resize:vertical;padding:10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);color:var(--text);
    font:13px/1.5 ui-monospace,Consolas,monospace}
  .stats{padding:0 18px 10px;color:var(--muted);font-size:13px}
  .stats b.add{color:#1a7f3c} .stats b.del{color:#c03a3a}
  .out{margin:0 18px 24px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    overflow:auto;max-height:calc(100vh - 200px);scroll-behavior:smooth}
  table{width:100%;border-collapse:collapse;font:13px/1.6 ui-monospace,Consolas,monospace}
  td{padding:2px 8px;vertical-align:top;white-space:pre-wrap;word-break:break-word}
  td.num{width:46px;text-align:right;color:var(--muted);background:rgba(127,127,127,.07);
    user-select:none;white-space:nowrap}
  tr.add td:not(.num){background:var(--add-bg)}
  tr.del td:not(.num){background:var(--del-bg)}
  tr.hdr td{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;padding:4px 8px}
  ins{background:var(--add-mark);text-decoration:none;border-radius:2px}
  del{background:var(--del-mark);text-decoration:none;border-radius:2px}
  .side td.pane{width:50%}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  .nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nav button{padding:4px 10px;font-size:12px;line-height:1}
  .nav button:disabled{opacity:.4;cursor:default;filter:none}
  #navPos{color:var(--muted);font-size:12px;min-width:46px;text-align:center;
    font-variant-numeric:tabular-nums}
  /* hunk đang focus khi bấm ▲/▼ */
  tr.cur > td{box-shadow:inset 0 2px 0 var(--accent)}
  tr.cur > td.num{color:var(--accent);font-weight:700}
  @media (max-width:820px){.inputs{grid-template-columns:1fr}}

  .setResult{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .setResult .setCol{padding:0}
  .setResult .setCol + .setCol{border-left:1px solid var(--border)}
  .setResult h3{margin:0;padding:8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);background:rgba(127,127,127,.12);position:sticky;top:0;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .setResult .copyBtn{text-transform:none;letter-spacing:0;font-size:11px;padding:3px 10px;
    border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
  .setResult .copyBtn:hover{filter:brightness(1.08)}
  .setResult ul{list-style:none;margin:0;padding:0}
  .setResult li{padding:4px 12px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .setResult li:nth-child(even){background:rgba(127,127,127,.05)}
  .setCol.onlyA li{background-color:var(--del-bg)!important}
  .setCol.onlyB li{background-color:var(--add-bg)!important}
  .setCol.onlyA li:nth-child(even), .setCol.onlyB li:nth-child(even){filter:brightness(0.97)}
  @media (max-width:820px){.setResult{grid-template-columns:1fr}.setResult .setCol + .setCol{border-left:0;border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <h1>Compare Text</h1>
  <label class="opt"><input type="checkbox" id="ignoreCase"> Bỏ qua hoa/thường</label>
  <label class="opt"><input type="checkbox" id="ignoreWs" checked> Bỏ qua khoảng trắng</label>
  <label class="opt"><input type="checkbox" id="ignoreBlank"> Bỏ qua dòng trống</label>
  <label class="opt"><input type="checkbox" id="sideBySide" checked> Side-by-side</label>
  <label class="opt"><input type="checkbox" id="onlyDiff"> Chỉ hiện dòng khác</label>
  <label class="opt"><input type="checkbox" id="setMode"> So sánh danh sách (A/B khác gì nhau, không quan tâm thứ tự)</label>
  <button class="primary" id="btnCmp">So sánh</button>
  <button id="btnSwap">Đổi chỗ</button>
  <button id="btnClear">Xoá</button>
  <span class="nav">
    <button id="btnPrev" title="Đoạn khác trước đó (Alt+↑ / Shift+Enter)" disabled>▲</button>
    <button id="btnNext" title="Đoạn khác kế tiếp (Alt+↓ / Enter)" disabled>▼</button>
    <span id="navPos">0 / 0</span>
  </span>
</header>

<div class="inputs">
  <div><h2>Text A (gốc)</h2><textarea id="a" placeholder="Dán text A..."></textarea></div>
  <div><h2>Text B (mới)</h2><textarea id="b" placeholder="Dán text B..."></textarea></div>
</div>

<div class="stats" id="stats"></div>
<div class="out" id="out"><div class="empty">Nhập text rồi bấm <b>So sánh</b> (hoặc Ctrl+Enter).</div></div>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare Text</title>
<script src="xlsx.full.min.js"></script>
<script src="mammoth.browser.min.js"></script>
<script src="pdf.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --add-bg:#e2f5e8; --add-mark:#a6e6b8; --del-bg:#fde8e8; --del-mark:#f3b0b0;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --add-bg:#12351f; --add-mark:#1f6b39; --del-bg:#3a1a1d; --del-mark:#7d2c33;
      --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  label.opt{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
  button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:hover{filter:brightness(1.08)}
  .inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px}
  .inputs > div{display:flex;flex-direction:column;gap:6px}
  .inputs .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .inputs h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  .importBtn{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);cursor:pointer}
  .importBtn:hover{filter:brightness(1.08)}
  .importBtn:disabled{opacity:.5;cursor:default}
  .importStatus{font-size:11px;color:var(--muted);min-height:14px}
  .importStatus.err{color:#c03a3a}
  textarea{width:100%;height:190px;resize:vertical;padding:10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);color:var(--text);
    font:13px/1.5 ui-monospace,Consolas,monospace}
  .stats{padding:0 18px 10px;color:var(--muted);font-size:13px}
  .bigTextBanner{color:#9a6b00;background:rgba(245,166,35,.12);margin:0 18px 8px;padding:6px 12px;
    border-radius:6px;font-size:12px}
  @media (prefers-color-scheme:dark){.bigTextBanner{color:#ffd27a}}
  .stats b.add{color:#1a7f3c} .stats b.del{color:#c03a3a}
  .out{margin:0 18px 24px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    overflow:auto;max-height:calc(100vh - 200px);scroll-behavior:smooth}
  table{width:100%;border-collapse:collapse;font:13px/1.6 ui-monospace,Consolas,monospace}
  td{padding:2px 8px;vertical-align:top;white-space:pre-wrap;word-break:break-word}
  td.num{width:46px;text-align:right;color:var(--muted);background:rgba(127,127,127,.07);
    user-select:none;white-space:nowrap}
  tr.add td:not(.num){background:var(--add-bg)}
  tr.del td:not(.num){background:var(--del-bg)}
  tr.hdr td{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;padding:4px 8px}
  ins{background:var(--add-mark);text-decoration:none;border-radius:2px}
  del{background:var(--del-mark);text-decoration:none;border-radius:2px}
  .side td.pane{width:50%}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  .nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nav button{padding:4px 10px;font-size:12px;line-height:1}
  .nav button:disabled{opacity:.4;cursor:default;filter:none}
  #navPos{color:var(--muted);font-size:12px;min-width:46px;text-align:center;
    font-variant-numeric:tabular-nums}
  /* hunk đang focus khi bấm ▲/▼ */
  tr.cur > td{box-shadow:inset 0 2px 0 var(--accent)}
  tr.cur > td.num{color:var(--accent);font-weight:700}
  @media (max-width:820px){.inputs{grid-template-columns:1fr}}

  .setResult{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .setResult .setCol{padding:0}
  .setResult .setCol + .setCol{border-left:1px solid var(--border)}
  .setResult h3{margin:0;padding:8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);background:rgba(127,127,127,.12);position:sticky;top:0;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .setResult .copyBtn{text-transform:none;letter-spacing:0;font-size:11px;padding:3px 10px;
    border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
  .setResult .copyBtn:hover{filter:brightness(1.08)}
  .setResult ul{list-style:none;margin:0;padding:0}
  .setResult li{padding:4px 12px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .setResult li:nth-child(even){background:rgba(127,127,127,.05)}
  .setCol.onlyA li{background-color:var(--del-bg)!important}
  .setCol.onlyB li{background-color:var(--add-bg)!important}
  .setCol.onlyA li:nth-child(even), .setCol.onlyB li:nth-child(even){filter:brightness(0.97)}
  @media (max-width:820px){.setResult{grid-template-columns:1fr}.setResult .setCol + .setCol{border-left:0;border-top:1px solid var(--border)}}

  .tableModeBar{display:flex;align-items:center;gap:10px;padding:8px 18px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--panel)}
  .tableModeBar select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px}
  .cmpTableWrap{overflow:auto}
  table.cmpTable{border-collapse:collapse;font:13px/1.5 ui-monospace,Consolas,monospace;width:max-content;min-width:100%}
  table.cmpTable th, table.cmpTable td{border:1px solid var(--border);padding:4px 8px;vertical-align:top;
    white-space:pre-wrap;word-break:break-word;max-width:320px}
  table.cmpTable th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;position:sticky;top:0;z-index:1}
  table.cmpTable th.rownumHead{left:0;position:sticky;z-index:2;background:rgba(127,127,127,.18)}
  table.cmpTable td.rownum{position:sticky;left:0;background:rgba(127,127,127,.10);color:var(--muted);
    text-align:right;user-select:none}
  table.cmpTable td.cellDiff{background:var(--del-bg)}
  table.cmpTable td.cellOnlyA{background:var(--del-bg)}
  table.cmpTable td.cellOnlyB{background:var(--add-bg)}
  table.cmpTable tr:nth-child(even) td:not(.cellDiff):not(.cellOnlyA):not(.cellOnlyB){background:rgba(127,127,127,.04)}

  /* ---- Nút copy cột/hàng dùng chung (table-copy.js) — hiện khi hover th/rownum ---- */
  th, td.rownum, td.rowh{ position:relative }
  .tblCopyBtn{position:absolute;top:2px;right:2px;display:none;padding:1px 4px;font-size:11px;
    line-height:1.4;border:1px solid var(--border);border-radius:4px;background:var(--panel);
    color:var(--text);cursor:pointer}
  th:hover .tblCopyBtn, td.rownum:hover .tblCopyBtn, td.rowh:hover .tblCopyBtn{display:inline-block}
  .tblCopyBtn:hover{filter:brightness(1.15)}

  /* ---- Bảng: 2 khu vực A/B tách biệt cạnh nhau + thanh kéo chia tỉ lệ rộng ---- */
  .cmpTableSplit{display:flex;align-items:stretch;height:calc(100vh - 260px);min-height:300px}
  .cmpTableSplit .paneWrap{overflow:auto;min-width:80px}
  .cmpTableSplit .paneWrap.paneA{flex:0 0 var(--splitPct,50%)}
  .cmpTableSplit .paneWrap.paneB{flex:1 1 auto}
  .cmpTableSplit .paneLabel{position:sticky;top:0;left:0;z-index:3;padding:4px 10px;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:rgba(127,127,127,.18);
    border-bottom:1px solid var(--border)}
  .splitHandle{flex:0 0 8px;width:8px;cursor:col-resize;background:var(--border);position:relative}
  .splitHandle:hover, .splitHandle.dragging{background:var(--accent)}
  .splitHandle::after{content:'⋮';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:var(--panel);font-size:12px}
  body.resizingSplit{cursor:col-resize;user-select:none}
  table.cmpTable td.cellDiffA{background:var(--del-bg)}
  table.cmpTable td.cellDiffB{background:var(--add-bg)}

  /* ---- Word/PDF giữ định dạng gốc: khối HTML gốc, tô nền khi khối không khớp giữa 2 bên ---- */
  .richDocPane{font:14px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;padding:0 12px 12px;
    font-size:calc(14px * var(--richZoom,1));transform-origin:top left}
  .richDocPane .paneLabel{margin:0 -12px 8px;position:sticky;top:0}
  .richZoomBar{display:flex;align-items:center;gap:4px;margin-left:auto}
  .richZoomBar button{padding:2px 9px;font-size:13px;line-height:1.4}
  .richZoomBar #richZoomPct{min-width:42px;text-align:center;color:var(--muted);font-size:12px;
    font-variant-numeric:tabular-nums}
  .richDocPane .richBlock{padding:2px 4px;border-radius:4px}
  .richDocPane .richBlock.richBlockDel{background:var(--del-bg)}
  .richDocPane .richBlock.richBlockAdd{background:var(--add-bg)}
  .richDocPane .richBlock :is(h1,h2,h3,h4,h5,h6){margin:.6em 0 .3em}
  .richDocPane .richBlock p{margin:.3em 0}
  .richDocPane .richBlock table{border-collapse:collapse;width:100%}
  .richDocPane .richBlock td, .richDocPane .richBlock th{border:1px solid var(--border);padding:4px 6px}
  .richDocPane .richBlock p.align-center{text-align:center}
  .richDocPane .richBlock p.align-right{text-align:right}
  .richDocPane .richBlock p.align-justify{text-align:justify}
  /* PDF hiển thị bằng ảnh trang thật — giữ nguyên layout/font gốc, không zoom theo font-size mà theo scale ảnh */
  .richDocPagesPane{padding:0 12px 16px}
  .richDocPagesPane .richPageImg{display:block;max-width:100%;width:calc(100% * var(--richZoom,1));
    margin:0 auto 10px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.08)}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
<script src="../assets/table-copy.js"></script>
</head>
<body>
<header>
  <h1 data-i18n="title">Compare Text</h1>
  <label class="opt"><input type="checkbox" id="ignoreCase"> <span data-i18n="optIgnoreCase">Bỏ qua hoa/thường</span></label>
  <label class="opt"><input type="checkbox" id="ignoreWs" checked> <span data-i18n="optIgnoreWs">Bỏ qua khoảng trắng</span></label>
  <label class="opt"><input type="checkbox" id="ignoreBlank"> <span data-i18n="optIgnoreBlank">Bỏ qua dòng trống</span></label>
  <label class="opt"><input type="checkbox" id="sideBySide" checked> <span data-i18n="optSideBySide">Side-by-side</span></label>
  <label class="opt"><input type="checkbox" id="onlyDiff"> <span data-i18n="optOnlyDiff">Chỉ hiện dòng khác</span></label>
  <label class="opt"><input type="checkbox" id="setMode"> <span data-i18n="optSetMode">So sánh danh sách (A/B khác gì nhau, không quan tâm thứ tự)</span></label>
  <label class="opt hidden" id="tableModeWrap"><input type="checkbox" id="tableMode"> <span data-i18n="optTableMode">So sánh dạng khối (Excel theo hàng/cột, Word/PDF giữ định dạng gốc) — chỉ khi A và B cùng loại</span></label>
  <button class="primary" id="btnCmp" data-i18n="btnCompare">So sánh</button>
  <button id="btnSwap" data-i18n="btnSwap">Đổi chỗ</button>
  <button id="btnClear" data-i18n="btnClear">Xoá</button>
  <span class="nav">
    <button id="btnPrev" data-i18n-title="navPrevTitle" title="Đoạn khác trước đó (Alt+↑ / Shift+Enter)" disabled>▲</button>
    <button id="btnNext" data-i18n-title="navNextTitle" title="Đoạn khác kế tiếp (Alt+↓ / Enter)" disabled>▼</button>
    <span id="navPos">0 / 0</span>
  </span>
</header>

<div class="inputs">
  <div>
    <div class="head">
      <h2 data-i18n="labelTextA">Text A (gốc)</h2>
      <button class="importBtn" id="btnImportA" data-i18n="btnImport">📄 Import file (Excel/Word/PDF)</button>
      <input type="file" id="fileInputA" accept=".xlsx,.xls,.csv,.docx,.pdf" style="display:none">
    </div>
    <textarea id="a" data-i18n-placeholder="placeholderA" placeholder="Dán text A, hoặc bấm Import file để nạp từ Excel/Word/PDF..."></textarea>
    <div class="importStatus" id="importStatusA"></div>
  </div>
  <div>
    <div class="head">
      <h2 data-i18n="labelTextB">Text B (mới)</h2>
      <button class="importBtn" id="btnImportB" data-i18n="btnImport">📄 Import file (Excel/Word/PDF)</button>
      <input type="file" id="fileInputB" accept=".xlsx,.xls,.csv,.docx,.pdf" style="display:none">
    </div>
    <textarea id="b" data-i18n-placeholder="placeholderB" placeholder="Dán text B, hoặc bấm Import file để nạp từ Excel/Word/PDF..."></textarea>
    <div class="importStatus" id="importStatusB"></div>
  </div>
</div>

<div class="tableModeBar hidden" id="tableModeBar">
  <label id="sheetSelectRowA"><span data-i18n="sheetALabel">Sheet A:</span> <select id="sheetSelectA"></select></label>
  <label id="sheetSelectRowB"><span data-i18n="sheetBLabel">Sheet B:</span> <select id="sheetSelectB"></select></label>
  <label class="opt" id="tableFirstRowHeaderWrap"><input type="checkbox" id="tableFirstRowHeader" checked> <span data-i18n="optFirstRowHeader">Dòng đầu là header</span></label>
  <div class="richZoomBar hidden" id="richZoomBar">
    <button id="btnRichZoomOut" title="Thu nhỏ" data-i18n-title="richZoomOut">−</button>
    <span id="richZoomPct">100%</span>
    <button id="btnRichZoomIn" title="Phóng to" data-i18n-title="richZoomIn">+</button>
    <button id="btnRichZoomReset" data-i18n="richZoomReset" title="Về 100%">100%</button>
  </div>
</div>
<div class="stats bigTextBanner hidden" id="bigTextBanner"></div>
<div class="stats" id="stats"></div>
<span id="showAllLines" class="hidden" data-active="0"></span>
<div class="out" id="out"><div class="empty" data-i18n="emptyPrompt">Nhập text rồi bấm <b>So sánh</b> (hoặc Ctrl+Enter).</div></div>

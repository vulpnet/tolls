<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Converter</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}
  main{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:14px}

  textarea{width:100%;height:160px;padding:12px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:14px ui-monospace,Consolas,monospace;resize:vertical}

  .caseGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .caseBtn{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--border);
    border-radius:10px;background:var(--panel);cursor:pointer;text-align:left}
  .caseBtn:hover{border-color:var(--accent)}
  .caseBtn b{font-size:13px}
  .caseBtn span{color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .resultBox{display:none;flex-direction:column;gap:8px}
  .resultBox.show{display:flex}
  .resultHead{display:flex;align-items:center;gap:10px}
  .resultHead b{font-size:13px}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px;margin-left:auto}
  button.act:hover{filter:brightness(1.08)}
</style>
</head>
<body>

<header>
  <h1>🔤 Case Converter</h1>
</header>

<main>
  <div class="wrap">
    <textarea id="input" placeholder="Dán hoặc gõ text vào đây, rồi bấm 1 kiểu chuyển đổi bên dưới..."></textarea>

    <div class="caseGrid" id="caseGrid"></div>

    <div class="resultBox" id="resultBox">
      <div class="resultHead">
        <b id="resultLabel"></b>
        <button class="act" id="btnCopyResult">Copy kết quả</button>
      </div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>
</main>

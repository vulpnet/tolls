<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Calculator</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
  .section{display:flex;flex-direction:column;gap:14px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  input[type=date], input[type=number], select{padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:14px}

  .row{display:flex;gap:10px}
  .row .field{flex:1}

  .resultBox{padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--panel);text-align:center}
  .resultBox .val{font-size:22px;font-weight:700;color:var(--accent)}
  .resultBox .sub{color:var(--muted);font-size:13px;margin-top:6px}

  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}

  /* ---- Lịch Âm Dương ---- */
  .calWrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
  .calNav{display:flex;align-items:center;gap:10px;justify-content:center}
  .calNav button{padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:14px}
  .calNav .calTitle{font-size:16px;font-weight:700;min-width:160px;text-align:center}
  .calNav select.calSelect{padding:7px 10px;font-size:14px;font-weight:600;border:1px solid var(--border);
    border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
  .calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .calGrid .dow{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;padding:4px}
  .calCell{aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    padding:4px 6px;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden}
  .calCell:hover{border-color:var(--accent)}
  .calCell.otherMonth{opacity:.35}
  .calCell.today{border-color:var(--accent);border-width:2px}
  .calCell.selected{background:rgba(37,99,235,.12);border-color:var(--accent)}
  .calCell .solarNum{font-size:15px;font-weight:700}
  .calCell.sunday .solarNum{color:#c03a3a}
  .calCell .lunarNum{font-size:11px;color:var(--muted)}
  .calCell .lunarNum.lunarFirst{color:var(--accent);font-weight:700}
  .calCell .holidayDot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#c03a3a}
  .calDetail{padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
    display:flex;flex-direction:column;gap:6px}
  .calDetail .dTitle{font-size:16px;font-weight:700}
  .calDetail .dLine{font-size:13px;color:var(--muted)}
  .calDetail .dHoliday{font-size:13px;color:#c03a3a;font-weight:600}

  .fsDisclaimer{font-size:11px;color:var(--muted);font-style:italic;padding-top:4px;border-top:1px dashed var(--border);margin-top:4px}
  .fsSection{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .fsSection .fsTitle{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
  .fsHours{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
  .fsHour{padding:5px 8px;border-radius:6px;font-size:12px;text-align:center;border:1px solid var(--border)}
  .fsHour.good{background:rgba(26,127,60,.12);border-color:#1a7f3c;color:#1a7f3c;font-weight:600}
  .fsHour.bad{color:var(--muted)}
  .fsTruc{font-size:13px}
  .fsTruc b{color:var(--accent)}
  .fsAge{font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(127,127,127,.08)}
  .fsAge.sinh, .fsAge.sinh2, .fsAge.hoa{background:rgba(26,127,60,.10)}
  .fsAge.khac, .fsAge.khac2{background:rgba(192,58,58,.10)}
  @media (max-width:520px){.calCell .lunarNum{font-size:9px}.calCell .solarNum{font-size:13px}}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">📅 Date Calculator</h1>
  <div class="tabs">
    <button id="tabDiff" class="active" data-i18n="tabDiff">Khoảng cách 2 ngày</button>
    <button id="tabAdd" data-i18n="tabAdd">Cộng/trừ ngày</button>
    <button id="tabAge" data-i18n="tabAge">Tính tuổi</button>
    <button id="tabLunar" data-i18n="tabLunar">🌙 Lịch Âm Dương</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- DIFF -->
    <div class="section" id="diffSection">
      <div class="row">
        <div class="field"><label data-i18n="diffFromLabel">Từ ngày</label><input type="date" id="diffFrom"></div>
        <div class="field"><label data-i18n="diffToLabel">Đến ngày</label><input type="date" id="diffTo"></div>
      </div>
      <label class="chk"><input type="checkbox" id="diffExcludeWeekend"> <span data-i18n="diffExcludeWeekend">Chỉ tính ngày làm việc (bỏ T7, CN)</span></label>
      <div class="resultBox">
        <div class="val" id="diffResult">—</div>
        <div class="sub" id="diffSub"></div>
      </div>
    </div>

    <!-- ADD -->
    <div class="section hidden" id="addSection">
      <div class="row">
        <div class="field"><label data-i18n="addFromLabel">Ngày gốc</label><input type="date" id="addFrom"></div>
        <div class="field"><label data-i18n="addFromTimeLabel">Giờ gốc (tuỳ chọn)</label><input type="time" id="addFromTime"></div>
      </div>
      <div class="row">
        <div class="field"><label data-i18n="addAmountLabel">Số ngày</label><input type="number" id="addAmount" value="30"></div>
        <div class="field">
          <label data-i18n="addOpLabel">Phép tính</label>
          <select id="addOp"><option value="add" data-i18n="addOpAdd">Cộng thêm</option><option value="sub" data-i18n="addOpSub">Trừ đi</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label data-i18n="addHoursLabel">Số giờ</label><input type="number" id="addHours" value="0"></div>
        <div class="field"><label data-i18n="addMinutesLabel">Số phút</label><input type="number" id="addMinutes" value="0"></div>
      </div>
      <div class="resultBox">
        <div class="val" id="addResult">—</div>
        <div class="sub" id="addSub"></div>
      </div>
    </div>

    <!-- AGE -->
    <div class="section hidden" id="ageSection">
      <div class="field"><label data-i18n="ageBirthLabel">Ngày sinh</label><input type="date" id="ageBirth"></div>
      <div class="field"><label data-i18n="ageToLabel">Tính đến ngày (mặc định hôm nay)</label><input type="date" id="ageTo"></div>
      <div class="resultBox">
        <div class="val" id="ageResult">—</div>
        <div class="sub" id="ageSub"></div>
      </div>
    </div>

    <!-- LUNAR CALENDAR -->
    <div class="section hidden calWrap" id="lunarSection">
      <div class="calNav">
        <button id="calPrev">◀</button>
        <select id="calMonthSelect" class="calSelect"></select>
        <select id="calYearSelect" class="calSelect"></select>
        <button id="calNext">▶</button>
        <button id="calToday" data-i18n="calToday">Hôm nay</button>
      </div>
      <div class="calGrid" id="calGrid"></div>
      <div class="field">
        <label data-i18n="calBirthYearLabel">Năm sinh (tuỳ chọn — để xem hợp/khắc tuổi với ngày đang chọn)</label>
        <input type="number" id="calBirthYear" data-i18n="calBirthYearPlaceholder" placeholder="Ví dụ: 1990" min="1900" max="2100">
      </div>
      <div class="calDetail" id="calDetail"></div>
    </div>

  </div>
</main>

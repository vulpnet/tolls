<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Calculator</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
  .section{display:flex;flex-direction:column;gap:14px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  input[type=date], input[type=number], select{padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:14px}

  .row{display:flex;gap:10px}
  .row .field{flex:1}

  .resultBox{padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--panel);text-align:center}
  .resultBox .val{font-size:22px;font-weight:700;color:var(--accent)}
  .resultBox .sub{color:var(--muted);font-size:13px;margin-top:6px}

  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>📅 Date Calculator</h1>
  <div class="tabs">
    <button id="tabDiff" class="active">Khoảng cách 2 ngày</button>
    <button id="tabAdd">Cộng/trừ ngày</button>
    <button id="tabAge">Tính tuổi</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- DIFF -->
    <div class="section" id="diffSection">
      <div class="row">
        <div class="field"><label>Từ ngày</label><input type="date" id="diffFrom"></div>
        <div class="field"><label>Đến ngày</label><input type="date" id="diffTo"></div>
      </div>
      <label class="chk"><input type="checkbox" id="diffExcludeWeekend"> Chỉ tính ngày làm việc (bỏ T7, CN)</label>
      <div class="resultBox">
        <div class="val" id="diffResult">—</div>
        <div class="sub" id="diffSub"></div>
      </div>
    </div>

    <!-- ADD -->
    <div class="section hidden" id="addSection">
      <div class="row">
        <div class="field"><label>Ngày gốc</label><input type="date" id="addFrom"></div>
        <div class="field"><label>Giờ gốc (tuỳ chọn)</label><input type="time" id="addFromTime"></div>
      </div>
      <div class="row">
        <div class="field"><label>Số ngày</label><input type="number" id="addAmount" value="30"></div>
        <div class="field">
          <label>Phép tính</label>
          <select id="addOp"><option value="add">Cộng thêm</option><option value="sub">Trừ đi</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Số giờ</label><input type="number" id="addHours" value="0"></div>
        <div class="field"><label>Số phút</label><input type="number" id="addMinutes" value="0"></div>
      </div>
      <div class="resultBox">
        <div class="val" id="addResult">—</div>
        <div class="sub" id="addSub"></div>
      </div>
    </div>

    <!-- AGE -->
    <div class="section hidden" id="ageSection">
      <div class="field"><label>Ngày sinh</label><input type="date" id="ageBirth"></div>
      <div class="field"><label>Tính đến ngày (mặc định hôm nay)</label><input type="date" id="ageTo"></div>
      <div class="resultBox">
        <div class="val" id="ageResult">—</div>
        <div class="sub" id="ageSub"></div>
      </div>
    </div>

  </div>
</main>

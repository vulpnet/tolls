<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lorem Ipsum Generator</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:16px}

  .optRow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .field{display:flex;align-items:center;gap:8px}
  .field label{font-size:13px;color:var(--muted)}
  input[type=number]{width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);font-size:13px}
  select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);font-size:13px}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}

  button.act{padding:8px 18px;border:none;border-radius:8px;background:var(--accent);color:#fff;
    font-weight:600;cursor:pointer;font-size:14px}
  button.act.secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);font-weight:400}

  textarea, .out{width:100%;min-height:280px;padding:14px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:14px;line-height:1.7;resize:vertical;white-space:pre-wrap}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 10px;border:1px solid var(--border);text-align:left}
  th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <h1>🎲 Lorem Ipsum / Dữ liệu giả</h1>
  <div class="tabs">
    <button id="tabLorem" class="active">Lorem Ipsum</button>
    <button id="tabFake">Dữ liệu giả (tên/email/SĐT)</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- LOREM -->
    <div id="loremSection">
      <div class="optRow">
        <div class="field"><label>Số lượng</label><input type="number" id="loremCount" value="3" min="1" max="50"></div>
        <div class="field">
          <label>Đơn vị</label>
          <select id="loremUnit">
            <option value="paragraphs">Đoạn văn</option>
            <option value="sentences">Câu</option>
            <option value="words">Từ</option>
          </select>
        </div>
        <label class="chk"><input type="checkbox" id="loremStartClassic" checked> Bắt đầu bằng "Lorem ipsum dolor sit amet..."</label>
        <button class="act" id="btnGenLorem">Tạo</button>
      </div>
      <div class="out" id="loremOut"></div>
      <button class="act secondary" id="btnCopyLorem">Copy kết quả</button>
    </div>

    <!-- FAKE DATA -->
    <div id="fakeSection" class="hidden">
      <div class="optRow">
        <div class="field"><label>Số dòng</label><input type="number" id="fakeCount" value="10" min="1" max="200"></div>
        <button class="act" id="btnGenFake">Tạo</button>
        <button class="act secondary" id="btnCopyFake">Copy dạng TSV</button>
      </div>
      <div style="overflow:auto">
        <table id="fakeTable"></table>
      </div>
    </div>

  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Converter</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:18px}

  .catRow{display:flex;gap:8px;flex-wrap:wrap}
  .catRow button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .catRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .convertGrid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  select, input[type=text]{padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:14px}
  input[type=text]{font-family:ui-monospace,Consolas,monospace}
  .swapBtn{padding:10px;border:1px solid var(--border);border-radius:50%;background:var(--panel);
    color:var(--accent);cursor:pointer;font-size:16px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .swapBtn:hover{background:rgba(37,99,235,.1)}

  .resultBox{padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
    text-align:center}
  .resultBox .val{font-size:22px;font-weight:700;color:var(--accent)}
  .resultBox .formula{color:var(--muted);font-size:12px;margin-top:4px}

  .quickTable{width:100%;border-collapse:collapse;font-size:13px}
  .quickTable th,.quickTable td{padding:6px 10px;border:1px solid var(--border);text-align:left}
  .quickTable th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <h1>📐 Unit Converter</h1>
</header>

<main>
  <div class="wrap">
    <div class="catRow" id="catRow"></div>

    <div class="convertGrid">
      <div class="field">
        <label>Từ</label>
        <select id="fromUnit"></select>
        <input type="text" id="fromVal" value="1">
      </div>
      <button class="swapBtn" id="btnSwap" title="Đảo chiều">⇄</button>
      <div class="field">
        <label>Sang</label>
        <select id="toUnit"></select>
        <input type="text" id="toVal" readonly>
      </div>
    </div>

    <div class="resultBox">
      <div class="val" id="resultVal">—</div>
      <div class="formula" id="resultFormula"></div>
    </div>

    <table class="quickTable" id="quickTable"></table>
  </div>
</main>

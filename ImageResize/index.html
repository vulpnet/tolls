<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resize/Nén Ảnh</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a; --ok-text:#1a8a4a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0; --ok-text:#5fd08a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .layout{width:100%;max-width:1100px;display:grid;grid-template-columns:300px 1fr;gap:24px}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}

  .panel{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=number], select{width:100%;padding:9px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);color:var(--text);font-size:13px}

  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1;min-width:100px}

  .radioGroup{display:flex;gap:14px;flex-wrap:wrap}
  .radioGroup label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)}

  .checkRow{display:flex;align-items:center;gap:8px;font-size:13px}

  .sliderRow{display:flex;align-items:center;gap:10px}
  .sliderRow input[type=range]{flex:1}
  .sliderRow .val{width:44px;text-align:right;color:var(--muted);font-size:13px}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;
    color:var(--muted);cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}
  .dropzone:hover, .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}
  .dropzone input{display:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel);
    display:flex;flex-direction:column}
  .card canvas{width:100%;height:140px;object-fit:contain;cursor:zoom-in;background:repeating-conic-gradient(#0000 0% 25%, rgba(127,127,127,.08) 0% 50%) 50%/16px 16px}
  .card .meta{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
  .card .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sizeInfo{font-size:12px}
  .card .sizeInfo .saved{color:var(--ok-text);font-weight:600}
  .card .cardActions{display:flex;gap:6px;margin-top:4px}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:60px 10px;border:1px dashed var(--border);
    border-radius:10px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.act{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act.small{padding:5px 10px;font-size:12px}
  button.act:disabled{opacity:.5;cursor:default}

  .hint{color:var(--muted);font-size:12px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;
    justify-content:center;z-index:100;cursor:zoom-out;padding:20px}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.4);
    background:repeating-conic-gradient(#0000 0% 25%, rgba(127,127,127,.15) 0% 50%) 50%/16px 16px}
  .lightbox .closeBtn{position:fixed;top:16px;right:20px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:18px}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="pageTitle">🗜️ Resize / Nén Ảnh</h1>
</header>

<main>
  <div class="layout">
    <div class="panel">
      <div class="field">
        <label data-i18n="lblSource">Ảnh nguồn</label>
        <div class="dropzone" id="dropzone">
          <span data-i18n="dropzoneText">Kéo-thả ảnh vào đây, hoặc bấm để chọn (chọn được nhiều ảnh)</span>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        <div class="hint" data-i18n="hintLimit">Xử lý trên trình duyệt — tối đa 50 ảnh/lần, khuyến nghị mỗi ảnh dưới 20MB.</div>
      </div>

      <div class="field">
        <label data-i18n="lblResizeMode">Chế độ đổi kích thước</label>
        <div class="radioGroup">
          <label><input type="radio" name="resizeMode" value="percent" checked> <span data-i18n="modePercent">Theo %</span></label>
          <label><input type="radio" name="resizeMode" value="exact"> <span data-i18n="modeExact">Kích thước cụ thể</span></label>
          <label><input type="radio" name="resizeMode" value="none"> <span data-i18n="modeNone">Giữ nguyên</span></label>
        </div>
      </div>

      <div id="percentOpts">
        <div class="field">
          <label data-i18n="lblScalePct">Tỉ lệ (%)</label>
          <div class="sliderRow">
            <input type="range" id="scalePct" min="5" max="100" value="70">
            <span class="val" id="scalePctVal">70%</span>
          </div>
        </div>
      </div>

      <div id="exactOpts" style="display:none">
        <div class="row">
          <div class="field">
            <label data-i18n="lblWidth">Rộng (px)</label>
            <input type="number" id="exactW" value="1024" min="1">
          </div>
          <div class="field">
            <label data-i18n="lblHeight">Cao (px)</label>
            <input type="number" id="exactH" value="768" min="1">
          </div>
        </div>
        <div class="checkRow">
          <input type="checkbox" id="keepRatio" checked>
          <label for="keepRatio" data-i18n="lblKeepRatio">Giữ tỉ lệ khung hình (theo chiều rộng)</label>
        </div>
      </div>

      <div class="field">
        <label data-i18n="lblFormat">Định dạng xuất</label>
        <select id="outFormat">
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png" data-i18n="fmtPngNoCompress">PNG (không nén chất lượng)</option>
        </select>
      </div>

      <div class="field" id="qualityField">
        <label data-i18n="lblQuality">Chất lượng nén</label>
        <div class="sliderRow">
          <input type="range" id="qualityRange" min="10" max="100" value="80">
          <span class="val" id="qualityVal">80%</span>
        </div>
      </div>

      <div class="hint" data-i18n="hintNoUpload">Xử lý hoàn toàn trên trình duyệt, ảnh không upload lên đâu cả.</div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="hint" id="countHint" data-i18n="countNone">Chưa có ảnh nào</div>
        <div class="actions">
          <button class="act primary" id="btnDownloadAll" disabled data-i18n="btnDownloadAll">Tải tất cả</button>
          <button class="act" id="btnClear" disabled data-i18n="btnClear">Xoá hết</button>
        </div>
      </div>
      <div id="resultArea"><div class="empty" data-i18n="emptyHint">Thêm ảnh ở bên trái để xem trước</div></div>
    </div>
  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Generator</title>
<script src="qrcode.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .layout{width:100%;max-width:820px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media (max-width:720px){.layout{grid-template-columns:1fr}}

  .panel{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  textarea, input[type=text]{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:14px ui-monospace,Consolas,monospace;resize:vertical}
  textarea{min-height:100px}

  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1;min-width:120px}
  select, input[type=color]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:13px}
  input[type=color]{padding:2px;height:38px;cursor:pointer}

  .sizeRow{display:flex;align-items:center;gap:10px}
  .sizeRow input[type=range]{flex:1}
  .sizeRow .sizeVal{width:52px;text-align:right;color:var(--muted);font-size:13px}

  .previewBox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;
    border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  #qrCanvas{background:#fff;border-radius:6px;image-rendering:pixelated}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px}
  .err{padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px;text-align:center}

  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button.act{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  .hint{color:var(--muted);font-size:12px}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">🔳 QR Code Generator</h1>
</header>

<main>
  <div class="layout">
    <div class="panel">
      <div class="field">
        <label data-i18n="lblContent">Nội dung (text, URL, số điện thoại...)</label>
        <textarea id="qrText" data-i18n="phContent" placeholder="Nhập text hoặc dán link vào đây, vd: https://example.com"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label data-i18n="lblEcLevel">Mức sửa lỗi</label>
          <select id="ecLevel">
            <option value="L" data-i18n="ecL">Thấp (L) — chứa được nhiều text hơn</option>
            <option value="M" selected data-i18n="ecM">Trung bình (M)</option>
            <option value="Q" data-i18n="ecQ">Cao (Q)</option>
            <option value="H" data-i18n="ecH">Rất cao (H) — chịu được che khuất/mờ</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label data-i18n="lblFgColor">Màu mã QR</label>
          <input type="color" id="fgColor" value="#000000">
        </div>
        <div class="field">
          <label data-i18n="lblBgColor">Màu nền</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </div>

      <div class="field">
        <label data-i18n="lblSize">Kích thước xuất ảnh (px)</label>
        <div class="sizeRow">
          <input type="range" id="sizeRange" min="128" max="1024" step="32" value="320">
          <span class="sizeVal" id="sizeVal">320px</span>
        </div>
      </div>

      <div class="hint" id="capacityHint"></div>
    </div>

    <div class="panel">
      <div class="previewBox">
        <div id="qrArea"><div class="empty" data-i18n="emptyPreview">Nhập nội dung bên trái để tạo mã QR</div></div>
        <div class="actions">
          <button class="act primary" id="btnDownloadPng" data-i18n="btnDownload" disabled>Tải PNG</button>
          <button class="act" id="btnCopyImg" data-i18n="btnCopyImg" disabled>Copy ảnh</button>
        </div>
      </div>
    </div>
  </div>
</main>

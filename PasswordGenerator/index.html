<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --weak:#c03a3a; --medium:#c2410c; --strong:#1a7f3c;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --weak:#f3b0b0; --medium:#ffa657; --strong:#7ee2a8;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px}

  .pwDisplay{display:flex;gap:8px;align-items:center}
  .pwDisplay input{flex:1;padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);font:18px ui-monospace,Consolas,monospace;letter-spacing:.5px}
  .pwDisplay button{padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:16px}
  .pwDisplay button:hover{background:rgba(37,99,235,.1)}

  .strengthBar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
  .strengthBar > i{display:block;height:100%;transition:width .2s,background .2s}
  .strengthLabel{font-size:13px;color:var(--muted);text-align:center}

  .options{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--border);
    border-radius:10px;background:var(--panel)}
  .lenRow{display:flex;align-items:center;gap:12px}
  .lenRow input[type=range]{flex:1}
  .lenRow .lenVal{width:36px;text-align:center;font-weight:700;color:var(--accent)}

  label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}

  button.act{padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;
    font-weight:600;cursor:pointer;font-size:14px}
  button.act:hover{filter:brightness(1.08)}

  .bulkOut{width:100%;height:140px;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace;resize:vertical}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">🔐 Password Generator</h1>
</header>

<main>
  <div class="wrap">
    <div class="pwDisplay">
      <input type="text" id="pwOut" readonly>
      <button id="btnCopy" data-i18n="titleCopy" title="Copy">📋</button>
      <button id="btnRegen" data-i18n="titleRegen" title="Tạo lại">🔄</button>
    </div>
    <div>
      <div class="strengthBar"><i id="strengthFill"></i></div>
      <div class="strengthLabel" id="strengthLabel"></div>
    </div>

    <div class="options">
      <div class="lenRow">
        <label data-i18n="lengthLabel" style="min-width:70px;color:var(--muted);font-size:13px">Độ dài</label>
        <input type="range" id="lenRange" min="4" max="64" value="16">
        <span class="lenVal" id="lenVal">16</span>
      </div>
      <label class="chk"><input type="checkbox" id="optUpper" checked> <span data-i18n="optUpper">Chữ HOA (A-Z)</span></label>
      <label class="chk"><input type="checkbox" id="optLower" checked> <span data-i18n="optLower">Chữ thường (a-z)</span></label>
      <label class="chk"><input type="checkbox" id="optNumber" checked> <span data-i18n="optNumber">Số (0-9)</span></label>
      <label class="chk"><input type="checkbox" id="optSymbol" checked> <span data-i18n="optSymbol">Ký tự đặc biệt (!@#$%...)</span></label>
      <label class="chk"><input type="checkbox" id="optAmbiguous"> <span data-i18n="optAmbiguous">Tránh ký tự dễ nhầm (l, 1, O, 0...)</span></label>
    </div>

    <button class="act" id="btnBulk" data-i18n="btnBulk">Tạo hàng loạt (10 mật khẩu)</button>
    <textarea class="bulkOut hidden" id="bulkOut" readonly></textarea>
  </div>
</main>

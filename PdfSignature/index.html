<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="pageTitle">Chữ Ký PDF</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a; --ok-text:#1a8a4a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0; --ok-text:#5fd08a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

  button.act{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act.small{padding:5px 10px;font-size:12px}
  button.act:disabled{opacity:.5;cursor:default}

  main{flex:1;overflow:auto;padding:20px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:16px}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;
    color:var(--muted);cursor:pointer;background:var(--panel)}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}

  .statusLine{font-size:13px;color:var(--muted)}
  .statusLine b.ok{color:var(--ok-text)}
  .statusLine b.err{color:var(--err-text)}

  .sigMakerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;
    justify-content:center;z-index:60}
  .sigMakerPanel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    width:min(520px,92vw);display:flex;flex-direction:column;gap:10px;padding:16px}
  .sigMakerPanel h3{margin:0;font-size:14px}
  .sigTabs{display:flex;gap:6px}
  .sigTabs button{padding:6px 14px;border:1px solid var(--border);border-radius:16px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:12.5px}
  .sigTabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  #sigCanvas{width:100%;height:180px;border:1px solid var(--border);border-radius:8px;background:#fff;
    touch-action:none;cursor:crosshair}
  .sigPanelActions{display:flex;justify-content:flex-end;gap:8px}

  .layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .pageNav{display:flex;align-items:center;gap:10px}
  .pageNav button{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .pageNav button:disabled{opacity:.4;cursor:default}

  .pageCanvasWrap{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;
    background:#fff;flex-shrink:0}
  .pageCanvasWrap canvas.pageCanvas{display:block;max-width:100%}
  .sigOverlay{position:absolute;border:1px dashed var(--accent);cursor:move}
  .sigOverlay img{width:100%;height:100%;pointer-events:none}
  .sigOverlay .resizeHandle{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;
    background:var(--accent);border-radius:3px;cursor:nwse-resize}
  .sigOverlay .removeBtn{position:absolute;top:-10px;right:-10px;width:20px;height:20px;border-radius:50%;
    background:var(--err-text);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1}

  .sigList{display:flex;flex-direction:column;gap:8px;min-width:220px}
  .sigThumb{border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel);
    display:flex;flex-direction:column;gap:6px;cursor:grab}
  .sigThumb img{max-width:100%;max-height:60px;object-fit:contain;cursor:zoom-in}
  .sigThumb .lbl{font-size:12px;color:var(--muted)}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;
    justify-content:center;z-index:100;cursor:zoom-out;padding:20px}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.4);background:#fff;border-radius:6px}
  .lightbox .closeBtn{position:fixed;top:16px;right:20px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:18px}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--border);
    border-radius:10px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="headerTitle">✍️ Chữ Ký PDF</h1>
  <div class="actions">
    <button class="act" id="btnNewSig" disabled data-i18n="btnNewSig">➕ Tạo chữ ký mới</button>
    <button class="act primary" id="btnExport" disabled data-i18n="btnExport">💾 Xuất PDF</button>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="dropzone" id="dropzone" data-i18n="dropzone">📄 Kéo-thả 1 file PDF vào đây, hoặc bấm để chọn
      <input type="file" id="fileInput" accept=".pdf" style="display:none">
    </div>
    <div class="statusLine" id="fileStatus"></div>
    <div class="hint" data-i18n="hintText">Tạo chữ ký (vẽ tay hoặc upload ảnh), kéo-thả đặt vào trang PDF, kéo góc dưới-phải để đổi kích thước. Xử lý hoàn toàn trên trình duyệt.</div>

    <div id="editorArea"></div>

  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table Builder</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a; --err-cell:#fde8e8;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0; --err-cell:#3a1a1d;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  select.exportPick{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);font-size:13px}

  main{flex:1;min-height:0;position:relative;padding:12px 18px;display:flex;flex-direction:column;gap:8px}
  .hint{color:var(--muted);font-size:12.5px}
  .gridWrap{flex:1;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}

  table{border-collapse:collapse;font:13px/1.5 ui-monospace,Consolas,monospace;width:max-content;min-width:100%}
  th,td{border:1px solid var(--border);padding:0;vertical-align:top}
  th{background:rgba(127,127,127,.12);position:sticky;top:0;z-index:1}
  th.rownumHead{left:0;position:sticky;z-index:3;background:rgba(127,127,127,.18);width:36px;text-align:center;color:var(--muted);font-size:12px}
  td.rownum{position:sticky;left:0;z-index:1;background:rgba(127,127,127,.10);color:var(--muted);
    text-align:right;padding:5px 8px;user-select:none;width:36px}

  tr.sumRow th{position:static;background:rgba(37,99,235,.08);font-size:12px;
    text-align:right;padding:5px 8px;color:var(--accent);font-weight:700}
  tr.sumRow th.rownumHead{position:sticky;left:0;background:rgba(127,127,127,.18);color:var(--muted);font-weight:400}

  .colHead{display:flex;flex-direction:column;gap:3px;padding:5px 6px;min-width:120px}
  .colHead .nameRow{display:flex;gap:4px;align-items:center}
  .colHead input.colName{flex:1;min-width:0;padding:3px 5px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--text);font:12px ui-monospace,Consolas,monospace;font-weight:700}
  .colHead select.colType{padding:2px 4px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--text);font-size:11px}
  .colHead button.delCol{border:1px solid var(--border);border-radius:4px;background:var(--panel);
    color:var(--err-text);cursor:pointer;font-size:11px;padding:2px 6px}

  td .cellInput{width:100%;min-width:120px;border:none;padding:5px 8px;background:transparent;color:var(--text);
    font:13px ui-monospace,Consolas,monospace}
  td .cellInput:focus{outline:2px solid var(--accent);outline-offset:-2px}
  td.cellError .cellInput{background:var(--err-cell)}
  td.cellError{position:relative}

  td.addColCell{background:transparent;border:none}
  button.addColBtn{width:100%;height:100%;min-height:60px;border:1px dashed var(--border);border-radius:6px;
    background:transparent;color:var(--muted);cursor:pointer;font-size:20px}
  button.addColBtn:hover{color:var(--accent);border-color:var(--accent)}

  tr.addRowRow td{background:transparent;border:none;padding:6px}
  button.addRowBtn{width:100%;padding:6px;border:1px dashed var(--border);border-radius:6px;
    background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  button.addRowBtn:hover{color:var(--accent);border-color:var(--accent)}

  .rowDelBtn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px}
  .rowDelBtn:hover{color:var(--err-text)}

  .errBanner{display:none;padding:8px 12px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px}
  .errBanner.show{display:block}

  .json-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;
    justify-content:center;z-index:50}
  .json-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    width:min(760px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .json-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .json-head b{font-size:13px}
  .json-head button{border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;padding:4px 10px;font-size:12px}
  .json-head .spacer{margin-left:auto}
  .json-body{padding:12px 14px;overflow:auto}
  .json-body pre{margin:0;font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;user-select:text}
</style>
<script src="../assets/bg-sync.js"></script>
</head>
<body>

<header>
  <h1>🧱 Table Builder</h1>
  <div class="actions">
    <button class="act" id="btnPaste">Dán từ Excel (Ctrl+V)</button>
    <button class="act" id="btnExportJson">Xuất JSON</button>
    <button class="act" id="btnExportCsv">Xuất CSV</button>
    <button class="act primary" id="btnExportXlsx">Xuất Excel</button>
    <button class="act" id="btnClearAll">Xoá hết</button>
  </div>
</header>

<main>
  <div class="hint">Click vào ô để sửa · Paste (Ctrl+V) khi đang chọn 1 ô để dán dữ liệu dạng bảng từ Excel/Sheets · Chọn kiểu cột để tự kiểm tra dữ liệu nhập vào</div>
  <div class="errBanner" id="errBanner"></div>
  <div class="gridWrap" id="gridWrap"></div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image to Text</title>
<script src="tesseract.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);font-size:13px}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

  .main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px}
  .main > div{display:flex;flex-direction:column;gap:8px;min-height:0}
  .main h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}

  .dropzone{flex:1;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:10px;cursor:pointer;color:var(--muted);
    padding:16px;text-align:center;overflow:auto;position:relative}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06);color:var(--accent)}
  .dropzone input{display:none}
  .dropzone img{max-width:100%;max-height:100%;border-radius:6px}

  .out{flex:1;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:10px}
  textarea#resultText{width:100%;height:100%;border:none;resize:none;background:transparent;color:var(--text);
    font:16px/1.7 ui-monospace,Consolas,monospace}
  textarea#resultText:focus{outline:none}

  .progressWrap{display:none;align-items:center;gap:10px;padding:8px 18px;color:var(--muted);font-size:13px}
  .progressBar{flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden}
  .progressBar > i{display:block;height:100%;background:var(--accent);width:0%;transition:width .15s}

  .err{margin:0 18px;padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px}
  .empty{color:var(--muted);text-align:center}
  @media (max-width:820px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>🖼️ Image → Text (OCR)</h1>
  <select id="langSelect">
    <option value="vie+eng">Tiếng Việt + Anh</option>
    <option value="vie">Chỉ Tiếng Việt</option>
    <option value="eng">Chỉ Tiếng Anh</option>
  </select>
  <div class="actions">
    <button class="act primary" id="btnRun" disabled>Nhận dạng text</button>
    <button class="act" id="btnCopy" disabled>Copy kết quả</button>
    <button class="act" id="btnClear">Xoá</button>
  </div>
</header>

<div class="progressWrap" id="progressWrap">
  <span id="progressLabel">Đang xử lý...</span>
  <div class="progressBar"><i id="progressBarInner"></i></div>
  <span id="progressPct">0%</span>
</div>

<div class="main">
  <div>
    <h2>Ảnh đầu vào</h2>
    <div class="dropzone" id="dropzone">
      <span id="dzText">Kéo thả ảnh vào đây, hoặc bấm để chọn / dán (Ctrl+V)</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>
  <div>
    <h2>Kết quả OCR</h2>
    <div class="out"><textarea id="resultText" placeholder="Văn bản nhận dạng sẽ hiện ở đây..." readonly></textarea></div>
  </div>
</div>

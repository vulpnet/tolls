<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex}
  aside{width:200px;flex-shrink:0;border-right:1px solid var(--border);background:var(--panel);
    display:flex;flex-direction:column;padding:14px 10px;gap:10px;overflow-y:auto}
  h1{font-size:15px;margin:0 4px;font-weight:600}
  .tabs{display:flex;flex-direction:column;gap:4px}
  .tabs button{padding:9px 12px;border:1px solid transparent;border-radius:8px;background:transparent;
    color:var(--text);cursor:pointer;font-size:13px;text-align:left}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tabs button:not(.active):hover{background:rgba(127,127,127,.12)}

  .group{display:flex;flex-direction:column;gap:4px}
  .group-head{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:8px;
    cursor:pointer;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    font-weight:700;user-select:none}
  .group-head:hover{background:rgba(127,127,127,.12)}
  .group-head .chev{transition:transform .15s;font-size:10px}
  .group-head.open .chev{transform:rotate(90deg)}
  .group-items{display:flex;flex-direction:column;gap:4px;padding-left:6px;overflow:hidden;
    max-height:0;transition:max-height .25s ease}
  .group-items.open{max-height:1000px}
  main{flex:1;min-height:0;position:relative}
  #frames{position:absolute;inset:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--panel)}
  iframe.active{display:block}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  @media (max-width:640px){
    body{flex-direction:column}
    aside{width:100%;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--border)}
    .tabs{flex-direction:row;flex-wrap:wrap}
  }
</style>
</head>
<body>
<aside>
  <h1>Tools</h1>
  <div class="tabs" id="tabs"></div>
</aside>
<main>
  <div class="empty" id="emptyMsg">Chọn tool để bắt đầu</div>

</main>

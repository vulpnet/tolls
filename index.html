<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="assets/bg-sync.js"></script>
<script src="assets/i18n-sync.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import {
    getFirestore, doc, runTransaction, onSnapshot
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDhbiOk1NX-gLXC-GaSr37ZDhojmn16KvI",
    authDomain: "tools-3210a.firebaseapp.com",
    projectId: "tools-3210a",
    storageBucket: "tools-3210a.firebasestorage.app",
    messagingSenderId: "763367485455",
    appId: "1:763367485455:web:2390c793ea50bf67d1f37a"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const counterRef = doc(db, 'visitorCounter', 'global');

  // hiển thị số hiện tại realtime (đổi ngay khi có người khác vào, không cần reload)
  onSnapshot(counterRef, snap => {
    const el = document.getElementById('visitorCounter');
    if (!el) return;
    const data = snap.data();
    const count = data ? data.uniqueCount : 0;
    el.innerHTML = `👥 <b>${count.toLocaleString('en-US')}</b> users`;
  }, err => console.warn('visitorCounter onSnapshot lỗi:', err.message));

  // mỗi thiết bị chỉ tính là 1 "người dùng duy nhất" — lưu 1 ID ngẫu nhiên vào localStorage,
  // lần đầu ghé thăm (chưa có ID) mới tăng uniqueCount; các lần sau chỉ tăng totalVisits
  const VISITOR_ID_KEY = 'toolsVisitorId';
  let visitorId = null;
  try{ visitorId = localStorage.getItem(VISITOR_ID_KEY); }catch(e){ /* localStorage bị chặn — vẫn tăng totalVisits, chỉ không nhớ để tránh đếm lại uniqueCount */ }
  const isFirstVisit = !visitorId;
  if (!visitorId) visitorId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  try{ localStorage.setItem(VISITOR_ID_KEY, visitorId); }catch(e){}

  runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    const cur = snap.exists() ? snap.data() : { uniqueCount: 0, totalVisits: 0 };
    tx.set(counterRef, {
      uniqueCount: cur.uniqueCount + (isFirstVisit ? 1 : 0),
      totalVisits: cur.totalVisits + 1,
    });
  }).catch(err => console.warn('visitorCounter transaction lỗi:', err.message));
</script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex}
  aside{width:200px;flex-shrink:0;border-right:1px solid var(--border);background:var(--panel);
    display:flex;flex-direction:column;padding:14px 10px;gap:10px;overflow-y:auto;position:relative}
  .resizeHandle{position:absolute;top:0;right:-3px;bottom:0;width:6px;cursor:col-resize;z-index:5}
  .resizeHandle:hover, .resizeHandle.dragging{background:rgba(37,99,235,.25)}
  body.resizingSidebar{cursor:col-resize;user-select:none}
  body.resizingSidebar iframe{pointer-events:none}
  .brand{display:flex;align-items:center;gap:8px;margin:0 4px}
  .brand img{width:26px;height:26px;flex-shrink:0;cursor:zoom-in;border-radius:6px;transition:transform .15s}
  .brand img:hover{transform:scale(1.12)}
  h1{font-size:15px;margin:0;font-weight:600}

  .visitorCounter{margin:0 4px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .visitorCounter b{color:var(--text);font-weight:700}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;
    justify-content:center;z-index:100;cursor:zoom-out;padding:20px}
  .lightbox img{width:min(70vw,420px);height:min(70vw,420px);object-fit:contain;
    box-shadow:0 10px 50px rgba(0,0,0,.5);border-radius:24px}
  .lightbox .closeBtn{position:fixed;top:16px;right:20px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:18px}

  .searchBox{position:relative;margin:0 2px}
  .searchBox input{width:100%;padding:8px 30px 8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:13px}
  .searchBox input:focus{outline:none;border-color:var(--accent)}
  .searchBox .clearBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:none;
    background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;display:none}
  .searchBox.hasText .clearBtn{display:block}
  .noResult{color:var(--muted);font-size:12.5px;padding:8px 12px;display:none}
  .noResult.show{display:block}

  .tabs{display:flex;flex-direction:column;gap:4px}
  .tabRow{display:flex;align-items:stretch;gap:2px}
  .tabRow button.tabBtn{flex:1;padding:9px 12px;border:1px solid transparent;border-radius:8px;background:transparent;
    color:var(--text);cursor:pointer;font-size:13px;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabRow button.tabBtn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tabRow button.tabBtn:not(.active):hover{background:rgba(127,127,127,.12)}
  .tabRow.hiddenBySearch{display:none}
  .tabRow.hiddenByUser{display:none}
  .group.hiddenBySearch{display:none}
  .group.allHiddenByUser{display:none}

  .favBtn{flex-shrink:0;width:28px;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:15px;border-radius:6px;opacity:.45}
  .favBtn:hover{opacity:1;background:rgba(127,127,127,.12)}
  .favBtn.isFav{opacity:1;color:#f0b400}

  .favGroup{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;margin-bottom:4px;
    border-bottom:1px solid var(--border)}
  .favGroup .favGroupLabel{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:700;padding:2px 12px}
  .favGroup.empty{display:none}

  .group{display:flex;flex-direction:column;gap:4px}
  .group-head{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:8px;
    cursor:pointer;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    font-weight:700;user-select:none}
  .group-head:hover{background:rgba(127,127,127,.12)}
  .group-head .chev{transition:transform .15s;font-size:10px}
  .group-head.open .chev{transform:rotate(90deg)}
  .group-items{display:flex;flex-direction:column;gap:4px;padding-left:6px;overflow:hidden;
    max-height:0;transition:max-height .25s ease}
  .group-items.open{max-height:1000px}

  .langRow{display:flex;align-items:center;gap:8px;padding:6px 4px;margin-top:auto;border-top:1px solid var(--border);padding-top:10px}
  .langRow label{font-size:12px;color:var(--muted);flex:1}
  .langRow select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);font-size:12.5px;cursor:pointer}

  .bgPickerRow{display:flex;align-items:center;gap:8px;padding:6px 4px}
  .bgPickerRow label{font-size:12px;color:var(--muted);flex:1}
  .bgPickerRow input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--border);border-radius:6px;
    background:none;cursor:pointer}
  .bgPickerRow button.resetBg{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;
    text-decoration:underline;padding:2px 4px}

  .customizeBtnRow{padding:2px 4px}
  .customizeBtnRow button{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);cursor:pointer;font-size:12.5px;text-align:left}
  .customizeBtnRow button:hover{background:rgba(127,127,127,.12)}

  .customizeOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
    justify-content:center;z-index:110;padding:20px}
  .customizeOverlay.open{display:flex}
  .customizePanel{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    width:min(440px,92vw);max-height:82vh;display:flex;flex-direction:column}
  .customizePanel .panelHead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .customizePanel .panelHead b{flex:1;font-size:14px}
  .customizePanel .panelHead button{border:none;background:transparent;color:var(--text);font-size:20px;
    cursor:pointer;padding:2px 6px}
  .customizePanel .panelHint{padding:8px 16px 0;font-size:12px;color:var(--muted);line-height:1.5}
  .customizePanel .panelList{flex:1;overflow-y:auto;padding:8px 16px 4px;display:flex;flex-direction:column;gap:2px}
  .customizePanel .panelGroupLabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:700;padding:10px 4px 4px}
  .customizePanel .checkRow{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;cursor:pointer}
  .customizePanel .checkRow:hover{background:rgba(127,127,127,.08);border-radius:6px}
  .customizePanel .panelFoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
  .customizePanel .panelFoot button{padding:7px 14px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);cursor:pointer;font-size:12.5px}

  main{flex:1;min-height:0;position:relative}
  #frames{position:absolute;inset:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--panel)}
  iframe.active{display:block}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .mobileTopbar{display:none}
  .mobileOverlay{display:none}

  @media (max-width:640px){
    body{flex-direction:column}
    aside{display:none} /* fix: sidebar dạng cột hiện đầy đủ chỉ dùng cho desktop — mobile thay bằng topbar + overlay bên dưới */

    .mobileTopbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);
      background:var(--panel);flex-shrink:0}
    .mobileTopbar img{width:24px;height:24px;flex-shrink:0}
    .mobileTopbar .curName{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mobileTopbar button{border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);
      padding:8px 10px;font-size:16px;cursor:pointer;flex-shrink:0}

    body{display:flex;flex-direction:column;height:100%}
    main{flex:1;min-height:0}

    .mobileOverlay.open{display:flex;position:fixed;inset:0;z-index:80;background:var(--bg);
      flex-direction:column;padding:14px 10px;gap:10px}
    .mobileOverlay .overlayHead{display:flex;align-items:center;gap:10px;margin:0 4px}
    .mobileOverlay .overlayHead h1{flex:1}
    .mobileOverlay .overlayHead button{border:none;background:transparent;color:var(--text);font-size:20px;
      cursor:pointer;padding:4px 8px}
    .mobileOverlay .tabsScroll{flex:1;overflow-y:auto}
    .mobileOverlay .tabs button{padding:12px;font-size:14px} /* fix: touch target lớn hơn cho ngón tay, 9px desktop hơi chật trên mobile */
    .mobileOverlay .langRow{margin-top:0;border-top:1px solid var(--border);flex-shrink:0}
    .mobileOverlay .bgPickerRow{flex-shrink:0}
  }
</style>
</head>

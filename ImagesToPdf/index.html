<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ảnh & Văn bản → PDF</title>
<script src="pdf-lib.min.js"></script>
<script src="mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .layout{width:100%;max-width:900px;display:flex;flex-direction:column;gap:18px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:13px;width:220px}

  .row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}

  .radioGroup{display:flex;gap:14px}
  .radioGroup label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;
    color:var(--muted);cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}
  .dropzone:hover, .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}
  .dropzone input{display:none}

  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);cursor:grab}
  .item.dragging{opacity:.4}
  .item img{width:56px;height:56px;object-fit:contain;background:repeating-conic-gradient(#0000 0% 25%, rgba(127,127,127,.08) 0% 50%) 50%/10px 10px;
    border-radius:4px;flex-shrink:0}
  .item .textIcon{width:56px;height:56px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(127,127,127,.12);font-size:22px}
  .item .name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .order{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .item button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:12px}
  .item .moveBtns{display:flex;gap:4px}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px;border:1px dashed var(--border);
    border-radius:10px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.act{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  .hint{color:var(--muted);font-size:12px}
  .status{font-size:13px}
  .status.err{color:var(--err-text)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

  .addRow{display:flex;gap:8px;flex-wrap:wrap}

  textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px -apple-system,Segoe UI,Roboto,sans-serif;
    resize:vertical;min-height:140px}

  .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:10}
  .modalOverlay[hidden]{display:none}
  .modalBox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;
    width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
  .modalBox h2{font-size:14px;margin:0}
  .modalActions{display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>

<header>
  <h1>🖼️➡️📄 Ảnh & Văn bản → PDF</h1>
</header>

<main>
  <div class="layout">
    <div class="field">
      <label>Ảnh nguồn</label>
      <div class="dropzone" id="dropzone">
        Kéo-thả ảnh vào đây, hoặc bấm để chọn (chọn được nhiều ảnh — JPG/PNG)
        <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple>
      </div>
      <div class="hint">Xử lý trên trình duyệt — tối đa 50 ảnh/lần, khuyến nghị tổng dung lượng dưới 200MB.</div>
    </div>

    <div class="addRow">
      <button class="act" id="btnAddText">📝 Thêm trang văn bản</button>
      <button class="act" id="btnAddDocx">📄 Thêm từ file Word (.docx)</button>
      <input type="file" id="docxInput" accept=".docx" style="display:none">
    </div>

    <div class="row">
      <div class="field">
        <label>Khổ trang</label>
        <select id="pageSize">
          <option value="fit">Vừa khít ảnh (không viền — trang text luôn dùng A4)</option>
          <option value="a4">A4 (ảnh canh giữa, giữ tỉ lệ)</option>
          <option value="letter">Letter (ảnh canh giữa, giữ tỉ lệ)</option>
        </select>
      </div>
      <div class="field">
        <label>Hướng trang (khi dùng A4/Letter)</label>
        <div class="radioGroup">
          <label><input type="radio" name="orient" value="auto" checked> Tự động theo ảnh</label>
          <label><input type="radio" name="orient" value="portrait"> Dọc</label>
          <label><input type="radio" name="orient" value="landscape"> Ngang</label>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="hint" id="countHint">Chưa có ảnh nào</div>
      <div class="actions">
        <button class="act" id="btnClear" disabled>Xoá hết</button>
        <button class="act primary" id="btnExport" disabled>Xuất PDF</button>
      </div>
    </div>
    <div class="status" id="status"></div>

    <div id="listArea"><div class="empty">Thêm ảnh ở trên để bắt đầu</div></div>
  </div>
</main>

<div class="modalOverlay" id="textModal" hidden>
  <div class="modalBox">
    <h2 id="textModalTitle">Thêm trang văn bản</h2>
    <textarea id="textModalInput" placeholder="Nhập nội dung trang này..."></textarea>
    <div class="modalActions">
      <button class="act" id="textModalCancel">Huỷ</button>
      <button class="act primary" id="textModalSave">Lưu</button>
    </div>
  </div>
</div>

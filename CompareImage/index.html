<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So Sánh Ảnh</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280;
    --accent:#2563eb; --err-bg:#fde8e8; --err-text:#c03a3a; --ok-text:#1a8a4a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2;
      --accent:#5b9bff; --err-bg:#3a1a1d; --err-text:#f3b0b0; --ok-text:#5fd08a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  .modeRow{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  .modeRow button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:13px}
  .modeRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:20px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:16px}

  .uploadRow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.uploadRow{grid-template-columns:1fr}}
  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;
    color:var(--muted);cursor:pointer;font-size:13px;min-height:120px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;background:var(--panel);position:relative;overflow:hidden}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}
  .dropzone input{display:none}
  .dropzone img.previewThumb{max-width:100%;max-height:110px;object-fit:contain}
  .dropzone .lbl{font-size:12px;color:var(--muted)}

  button.act{padding:9px 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  .statusLine{font-size:13px;color:var(--muted)}
  .statusLine b.ok{color:var(--ok-text)}
  .statusLine b.err{color:var(--err-text)}
  .statusLine b.warn{color:#c98a1a}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--border);
    border-radius:10px}

  /* ---- Slider mode ---- */
  .sliderWrap{position:relative;width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--border);
    background:repeating-conic-gradient(#0000 0% 25%, rgba(127,127,127,.08) 0% 50%) 50%/16px 16px;user-select:none}
  .sliderWrap img{display:block;width:100%;height:auto}
  .sliderWrap .imgBefore{display:block}
  .sliderWrap .imgAfterWrap{position:absolute;top:0;left:0;height:100%;overflow:hidden;width:50%}
  .sliderWrap .imgAfterWrap img{width:var(--fullw);max-width:none;height:100%;object-fit:contain}
  .sliderHandle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--accent);cursor:ew-resize;
    transform:translateX(-50%)}
  .sliderHandle::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:32px;height:32px;border-radius:50%;background:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .sliderHandle::after{content:'↔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;font-size:14px;z-index:1}

  /* ---- Diff mode ---- */
  .diffRow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .diffCanvasWrap{flex:1;min-width:280px;border:1px solid var(--border);border-radius:10px;overflow:hidden;
    background:repeating-conic-gradient(#0000 0% 25%, rgba(127,127,127,.08) 0% 50%) 50%/16px 16px}
  .diffCanvasWrap canvas{width:100%;height:auto;display:block;cursor:zoom-in}
  .diffStats{min-width:200px;display:flex;flex-direction:column;gap:8px}
  .diffStats .statBox{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
  .diffStats .statBox b{font-size:22px;display:block}
  .diffStats .statBox span{font-size:12px;color:var(--muted)}

  .sliderRow{display:flex;align-items:center;gap:10px}
  .sliderRow input[type=range]{flex:1}
  .sliderRow .val{width:44px;text-align:right;color:var(--muted);font-size:13px}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:20px}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .lightbox.imgLightbox{cursor:zoom-out}
  .lightbox .closeBtn{position:fixed;top:16px;right:20px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:18px;z-index:1}

  .sliderZoomWrap{max-width:min(92vw,1400px);max-height:92vh;width:100%}
  .sliderZoomWrap .sliderWrap{max-height:92vh}
  .sliderZoomWrap img{width:100%;height:auto;max-height:92vh;object-fit:contain}

  .zoomBtnRow{display:flex;justify-content:flex-end}
  .zoomBtnRow button{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:12.5px}

  .hint{font-size:12px;color:var(--muted);line-height:1.6}
</style>
<script src="../assets/bg-sync.js"></script>
</head>
<body>

<header><h1>🖼️ So Sánh Ảnh</h1></header>

<div class="modeRow">
  <button data-mode="slider" class="active">↔ Slider trượt</button>
  <button data-mode="diff">🎯 Diff pixel</button>
</div>

<main>
  <div class="wrap">

    <div class="uploadRow">
      <div class="dropzone" id="dropA">🅰️ Ảnh A (trước)<div class="lbl">Kéo-thả hoặc bấm để chọn</div>
        <input type="file" id="inputA" accept="image/*">
      </div>
      <div class="dropzone" id="dropB">🅱️ Ảnh B (sau)<div class="lbl">Kéo-thả hoặc bấm để chọn</div>
        <input type="file" id="inputB" accept="image/*">
      </div>
    </div>

    <div class="statusLine" id="status"></div>

    <div id="resultArea"><div class="empty">Chọn 2 ảnh để so sánh</div></div>

  </div>
</main>

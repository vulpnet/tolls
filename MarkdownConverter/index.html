<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown Converter</title>
<script src="marked.min.js"></script>
<script src="turndown.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  button.act{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;min-height:0;padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;gap:6px;min-height:0}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;flex:1;resize:none;padding:12px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace}

  .preview{flex:1;overflow:auto;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
  .preview h1,.preview h2,.preview h3{margin-top:0}
  .preview table{border-collapse:collapse}
  .preview table td, .preview table th{border:1px solid var(--border);padding:4px 8px}
  .preview code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px;font-size:.9em}
  .preview pre{background:rgba(127,127,127,.1);padding:10px;border-radius:6px;overflow:auto}
  .preview blockquote{border-left:3px solid var(--border);margin-left:0;padding-left:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>📝 Markdown Converter</h1>
  <div class="tabs">
    <button id="tabMdToHtml" class="active">Markdown → HTML/Word</button>
    <button id="tabHtmlToMd">HTML → Markdown</button>
  </div>
  <div class="actions">
    <button class="act" id="btnCopyOutput">Copy kết quả</button>
    <button class="act primary hidden" id="btnExportDoc">Tải file Word (.doc)</button>
  </div>
</header>

<main>
  <div class="panel">
    <h2 id="inputLabel">Markdown</h2>
    <textarea id="input" placeholder="# Tiêu đề&#10;&#10;Nội dung **in đậm**, *in nghiêng*, danh sách:&#10;- Mục 1&#10;- Mục 2"></textarea>
  </div>
  <div class="panel">
    <h2 id="outputLabel">Xem trước (render)</h2>
    <div class="preview" id="preview"></div>
  </div>
</main>

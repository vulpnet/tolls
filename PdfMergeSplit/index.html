<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merge / Split PDF</title>
<script src="pdf-lib.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --err-bg:#fde8e8; --err-text:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --err-bg:#3a1a1d; --err-text:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:16px}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:20px;
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06);color:var(--accent)}
  .dropzone input{display:none}

  .fileList{display:flex;flex-direction:column;gap:8px}
  .fileRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel)}
  .fileRow .fname{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fileRow .fmeta{color:var(--muted);font-size:12px}
  .fileRow button{border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);
    cursor:pointer;font-size:12px;padding:3px 8px}
  .fileRow .moveBtns{display:flex;gap:2px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  input[type=text]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);font-size:13px;font-family:ui-monospace,Consolas,monospace}

  button.act{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;
    font-weight:600;cursor:pointer;font-size:14px}
  button.act:disabled{opacity:.5;cursor:default}
  button.act.secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);font-weight:400}

  .hint{color:var(--muted);font-size:12px}
  .err{padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px}
  .status{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>📎 Merge / Split PDF</h1>
  <div class="tabs">
    <button id="tabMerge" class="active">Gộp nhiều PDF</button>
    <button id="tabSplit">Tách trang PDF</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- MERGE -->
    <div id="mergeSection">
      <div class="dropzone" id="mergeDropzone">
        <span>Kéo thả nhiều file PDF vào đây, hoặc bấm để chọn (có thể chọn nhiều file)</span>
        <input type="file" id="mergeInput" accept="application/pdf" multiple>
      </div>
      <div class="fileList" id="mergeFileList"></div>
      <div class="hint" id="mergeHint"></div>
      <button class="act" id="btnMerge" disabled>Gộp thành 1 file PDF</button>
      <div id="mergeStatus"></div>
    </div>

    <!-- SPLIT -->
    <div id="splitSection" class="hidden">
      <div class="dropzone" id="splitDropzone">
        <span>Kéo thả 1 file PDF vào đây, hoặc bấm để chọn</span>
        <input type="file" id="splitInput" accept="application/pdf">
      </div>
      <div class="hint" id="splitFileInfo"></div>
      <div class="field">
        <label>Trang cần tách (vd: 1,3,5-8) — để trống = tách toàn bộ thành từng trang riêng</label>
        <input type="text" id="splitRange" placeholder="1,3,5-8">
      </div>
      <button class="act" id="btnSplit" disabled>Tách trang</button>
      <div id="splitStatus"></div>
    </div>

  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Counter</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  main{flex:1;min-height:0;padding:12px 18px;display:grid;grid-template-columns:1fr 280px;gap:16px}
  @media (max-width:820px){main{grid-template-columns:1fr}}

  textarea{width:100%;height:100%;min-height:300px;padding:14px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:14px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;resize:none}

  .stats{display:flex;flex-direction:column;gap:10px}
  .statCard{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
    display:flex;justify-content:space-between;align-items:baseline}
  .statCard .label{color:var(--muted);font-size:13px}
  .statCard .value{font-size:20px;font-weight:700;color:var(--accent)}

  .readTimeCard{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  .readTimeCard .label{color:var(--muted);font-size:13px;margin-bottom:4px}
  .readTimeCard .value{font-size:16px;font-weight:700}

  .freqTable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .freqTable th,.freqTable td{padding:5px 8px;border:1px solid var(--border);text-align:left}
  .freqTable th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <h1>📝 Word Counter</h1>
</header>

<main>
  <textarea id="input" placeholder="Dán hoặc gõ văn bản vào đây để đếm..."></textarea>

  <div class="stats">
    <div class="statCard"><span class="label">Số từ</span><span class="value" id="wordCount">0</span></div>
    <div class="statCard"><span class="label">Số ký tự (kể cả khoảng trắng)</span><span class="value" id="charCount">0</span></div>
    <div class="statCard"><span class="label">Số ký tự (không khoảng trắng)</span><span class="value" id="charNoSpaceCount">0</span></div>
    <div class="statCard"><span class="label">Số câu</span><span class="value" id="sentenceCount">0</span></div>
    <div class="statCard"><span class="label">Số đoạn văn</span><span class="value" id="paraCount">0</span></div>

    <div class="readTimeCard">
      <div class="label">Thời gian đọc ước tính (200 từ/phút)</div>
      <div class="value" id="readTime">0 giây</div>
    </div>
    <div class="readTimeCard">
      <div class="label">Thời gian nói ước tính (130 từ/phút)</div>
      <div class="value" id="speakTime">0 giây</div>
    </div>

    <table class="freqTable" id="freqTable"></table>
  </div>
</main>

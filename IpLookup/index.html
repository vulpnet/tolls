<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra cứu IP</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --err-bg:#fde8e8; --err-text:#c03a3a; --ok-bg:#e2f5e8;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --err-bg:#3a1a1d; --err-text:#f3b0b0; --ok-bg:#12351f;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}

  .tabRow{display:flex;gap:6px;margin-left:auto}
  .tabRow button{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:16px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=text], textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:14px ui-monospace,Consolas,monospace}
  textarea{min-height:140px;resize:vertical}

  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  button.act{padding:10px 20px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:14px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  .hint{color:var(--muted);font-size:12px}
  .err{padding:10px;background:var(--err-bg);color:var(--err-text);border-radius:8px;font-size:13px}

  .resultCard{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:18px;
    display:flex;flex-direction:column;gap:12px}
  .resultCard .ipHead{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
  .resultCard .ipHead .flag{font-size:26px}
  .infoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .infoItem{display:flex;flex-direction:column;gap:2px}
  .infoItem .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .infoItem .v{font-size:14px;font-weight:600}
  .mapLink{color:var(--accent);font-size:13px}

  table{width:100%;border-collapse:collapse;font:13px/1.5 ui-monospace,Consolas,monospace}
  th,td{padding:6px 10px;border:1px solid var(--border);text-align:left;vertical-align:top}
  th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;position:sticky;top:0}
  tr.err td{background:var(--err-bg)}
  .tableWrap{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:60vh;background:var(--panel)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px}
</style>
</head>
<body>

<header>
  <h1>🌐 Tra cứu IP</h1>
  <div class="tabRow" id="tabRow">
    <button data-tab="single" class="active">Tra 1 IP</button>
    <button data-tab="batch">Tra hàng loạt</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- TAB: SINGLE -->
    <div id="tabSingle">
      <div class="field">
        <label>Địa chỉ IP</label>
        <div class="row">
          <input type="text" id="ipInput" placeholder="Ví dụ: 8.8.8.8 (để trống rồi bấm Tra IP của tôi để xem IP hiện tại)" style="flex:1;min-width:220px">
          <button class="act primary" id="btnLookup">Tra cứu</button>
          <button class="act" id="btnMyIp">📍 IP của tôi</button>
        </div>
        <div class="hint">Dữ liệu từ ipwho.is — vị trí ước tính theo IP, có thể lệch so với vị trí thực tế (đặc biệt với mạng di động/VPN/proxy).</div>
      </div>
      <div id="singleResult"></div>
    </div>

    <!-- TAB: BATCH -->
    <div id="tabBatch" style="display:none">
      <div class="field">
        <label>Danh sách IP (mỗi dòng 1 địa chỉ)</label>
        <textarea id="batchInput" placeholder="8.8.8.8&#10;1.1.1.1&#10;208.67.222.222"></textarea>
        <div class="hint">Giới hạn 100 IP/lần, tra tuần tự với độ trễ nhỏ giữa các request để tránh bị API chặn do gọi quá nhanh.</div>
      </div>
      <div class="row">
        <button class="act primary" id="btnBatchLookup">Tra tất cả</button>
        <button class="act" id="btnBatchClear">Xoá</button>
      </div>
      <div class="toolbar">
        <div class="hint" id="batchProgress"></div>
        <button class="act" id="btnBatchCopy" style="display:none">Copy kết quả (TSV)</button>
      </div>
      <div id="batchResult"></div>
    </div>

  </div>
</main>

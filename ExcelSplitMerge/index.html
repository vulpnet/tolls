<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tách / Gộp Excel</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --err-bg:#fde8e8; --err-text:#c03a3a; --ok-text:#1a8a4a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --err-bg:#3a1a1d; --err-text:#f3b0b0; --ok-text:#5fd08a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}

  .modeRow{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  .modeRow button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:13px}
  .modeRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:20px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:900px;display:flex;flex-direction:column;gap:16px}
  .page{display:none;flex-direction:column;gap:16px}
  .page.active{display:flex}

  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;
    color:var(--muted);cursor:pointer;background:var(--panel)}
  .dropzone.drag{border-color:var(--accent);background:rgba(37,99,235,.06)}

  .fileList{display:flex;flex-direction:column;gap:6px}
  .fileRow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);font-size:13px}
  .fileRow .name{flex:1;word-break:break-all}
  .fileRow button{border:none;background:transparent;color:var(--err-text);cursor:pointer;font-size:16px;padding:2px 6px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  select, input[type=text]{padding:9px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:13px}

  label.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text)}

  button.act{padding:10px 20px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.act:disabled{opacity:.5;cursor:default}

  .statusLine{font-size:13px;color:var(--muted)}
  .statusLine b.ok{color:var(--ok-text)}
  .statusLine b.err{color:var(--err-text)}

  .tableWrap{max-height:340px;overflow:auto;border-radius:8px;border:1px solid var(--border)}
  table.previewTable{width:100%;border-collapse:collapse;font:12.5px ui-monospace,Consolas,monospace}
  table.previewTable th,table.previewTable td{padding:5px 8px;border:1px solid var(--border);text-align:left;
    white-space:nowrap}
  table.previewTable th{background:rgba(127,127,127,.12);color:var(--muted);position:sticky;top:0}

  .resultList{display:flex;flex-direction:column;gap:6px}
  .resultRow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);font-size:13px}
  .resultRow .name{flex:1}
  .resultRow a{color:var(--accent);text-decoration:none;font-weight:600}

  .hint{font-size:12px;color:var(--muted);line-height:1.6}
</style>
<script src="../assets/bg-sync.js"></script>
</head>
<body>

<header><h1>🔀 Tách / Gộp Excel</h1></header>

<div class="modeRow">
  <button data-page="merge" class="active">🔗 Gộp nhiều file</button>
  <button data-page="split">✂️ Tách 1 file theo cột</button>
</div>

<main>
  <div class="wrap">

    <!-- ================= GỘP ================= -->
    <div class="page active" data-page="merge">
      <div class="dropzone" id="mergeDrop">📂 Kéo-thả nhiều file Excel/CSV vào đây, hoặc bấm để chọn<br>
        <input type="file" id="mergeInput" accept=".xlsx,.xls,.csv" multiple style="display:none">
      </div>
      <div class="fileList" id="mergeFileList"></div>

      <div class="field">
        <label class="chk"><input type="checkbox" id="mergeHasHeader" checked> Dòng đầu mỗi file là header (chỉ giữ 1 header duy nhất khi gộp)</label>
      </div>

      <div class="hint">Gộp theo thứ tự file đã thêm, nối các dòng dữ liệu lại thành 1 sheet duy nhất. Chỉ đọc sheet đầu tiên của mỗi file.</div>

      <button class="act primary" id="btnMerge" disabled>🔗 Gộp thành 1 file Excel</button>
      <div class="statusLine" id="mergeStatus"></div>
    </div>

    <!-- ================= TÁCH ================= -->
    <div class="page" data-page="split">
      <div class="dropzone" id="splitDrop">📂 Kéo-thả 1 file Excel/CSV vào đây, hoặc bấm để chọn<br>
        <input type="file" id="splitInput" accept=".xlsx,.xls,.csv" style="display:none">
      </div>
      <div class="statusLine" id="splitFileStatus"></div>

      <div class="field" id="splitSheetField" style="display:none">
        <label>Chọn sheet</label>
        <select id="splitSheetSelect"></select>
      </div>

      <div class="field" id="splitColField" style="display:none">
        <label>Tách theo cột (dòng đầu = tên cột)</label>
        <select id="splitColSelect"></select>
      </div>

      <div id="splitPreviewWrap" class="tableWrap" style="display:none">
        <table class="previewTable" id="splitPreviewTable"></table>
      </div>

      <div class="statusLine" id="splitGroupStatus"></div>

      <button class="act primary" id="btnSplit" disabled>✂️ Tách thành nhiều file</button>
      <div class="statusLine" id="splitStatus"></div>
      <div class="resultList" id="splitResultList"></div>
    </div>

  </div>
</main>

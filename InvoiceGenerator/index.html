<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="pageTitle">Tạo Hóa Đơn/Báo Giá</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  button.act{padding:7px 16px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px}
  .formArea{max-width:900px;margin:0 auto 24px;display:flex;flex-direction:column;gap:16px}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:720px){.row2{grid-template-columns:1fr}}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=text], input[type=number], input[type=date], textarea{width:100%;padding:8px 10px;
    border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:13px}
  textarea{resize:vertical;min-height:50px}

  .sectionTitle{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:4px}

  .itemsTable{width:100%;border-collapse:collapse;font-size:13px}
  .itemsTable th,.itemsTable td{padding:6px 8px;border:1px solid var(--border);text-align:left}
  .itemsTable th{background:rgba(127,127,127,.1);color:var(--muted);font-size:11px}
  .itemsTable input{border:none;padding:4px;width:100%;background:transparent;color:var(--text);font-size:13px}
  .itemsTable input:focus{outline:1px solid var(--accent);border-radius:4px}
  .itemsTable td.num{text-align:right}
  .itemsTable td.delCol{text-align:center;width:36px}
  .itemsTable td.delCol button{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
  .itemsTable td.delCol button:hover{color:#c03a3a}

  .totalsBox{display:flex;flex-direction:column;gap:6px;align-self:flex-end;width:280px;font-size:13px}
  .totalsBox .line{display:flex;justify-content:space-between}
  .totalsBox .line.grand{font-weight:700;font-size:16px;border-top:2px solid var(--border);padding-top:8px;color:var(--accent)}
  .taxInput{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);text-align:right}

  .btnAddRow{padding:6px 14px;border:1px dashed var(--border);border-radius:6px;background:transparent;
    color:var(--muted);cursor:pointer;font-size:12px;align-self:flex-start}
  .btnAddRow:hover{color:var(--accent);border-color:var(--accent)}

  /* ---- vùng in / xuất — CHỈ hiển thị khi in, ẩn trong chế độ chỉnh sửa ---- */
  #printArea{display:none}
  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;color:#000;background:#fff}
    header, .formArea{display:none !important}
  }
  .printDoc{font-family:Arial,Helvetica,sans-serif;color:#000}
  .printDoc h2{font-size:22px;margin:0 0 4px;text-align:center;text-transform:uppercase}
  .printDoc .subTitle{text-align:center;color:#555;margin-bottom:20px;font-size:13px}
  .printDoc .partiesRow{display:flex;justify-content:space-between;margin-bottom:20px;gap:20px}
  .printDoc .party{flex:1;font-size:13px}
  .printDoc .party b{display:block;margin-bottom:4px;font-size:13px}
  .printDoc table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}
  .printDoc th,.printDoc td{border:1px solid #999;padding:6px 8px}
  .printDoc th{background:#f0f0f0;text-align:left}
  .printDoc td.num{text-align:right}
  .printDoc .totalsPrint{width:280px;margin-left:auto;font-size:13px}
  .printDoc .totalsPrint .line{display:flex;justify-content:space-between;padding:3px 0}
  .printDoc .totalsPrint .grand{font-weight:700;font-size:16px;border-top:2px solid #000;padding-top:6px}
  .printDoc .noteBox{margin-top:20px;font-size:12px;color:#444}
  .printDoc .signRow{display:flex;justify-content:space-between;margin-top:50px;font-size:13px;text-align:center}
  .printDoc .signRow div{flex:1}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="headerTitle">🧾 Tạo Hóa Đơn / Báo Giá</h1>
  <div class="actions">
    <button class="act" id="btnClear" data-i18n="btnClear">Xoá hết, làm lại</button>
    <button class="act primary" id="btnPrint" data-i18n="btnPrint">🖨️ In / Xuất PDF</button>
  </div>
</header>

<main>
  <div class="formArea">

    <div class="row2">
      <div>
        <div class="sectionTitle" data-i18n="secDocType">Loại chứng từ & Số</div>
        <div class="field">
          <label data-i18n="lblDocType">Loại</label>
          <select id="docType" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:13px">
            <option value="Báo giá" data-i18n="optQuote">Báo giá</option>
            <option value="Hóa đơn" data-i18n="optInvoice">Hóa đơn</option>
          </select>
        </div>
        <div class="row2">
          <div class="field"><label data-i18n="lblDocNo">Số chứng từ</label><input type="text" id="docNo" value="001"></div>
          <div class="field"><label data-i18n="lblDocDate">Ngày lập</label><input type="date" id="docDate"></div>
        </div>
      </div>
      <div>
        <div class="sectionTitle" data-i18n="secNote">Ghi chú (tuỳ chọn)</div>
        <div class="field"><textarea id="note" placeholder="Điều khoản thanh toán, ghi chú thêm..." data-i18n="placeholderNote"></textarea></div>
      </div>
    </div>

    <div class="row2">
      <div>
        <div class="sectionTitle" data-i18n="secSeller">Bên bán / Bên lập</div>
        <div class="field"><label data-i18n="lblCompanyName">Tên công ty</label><input type="text" id="sellerName" value="Công ty TNHH ABC"></div>
        <div class="field"><label data-i18n="lblAddress">Địa chỉ</label><input type="text" id="sellerAddr" value=""></div>
        <div class="field"><label data-i18n="lblContact">SĐT / Email</label><input type="text" id="sellerContact" value=""></div>
      </div>
      <div>
        <div class="sectionTitle" data-i18n="secBuyer">Bên mua / Khách hàng</div>
        <div class="field"><label data-i18n="lblBuyerName">Tên khách hàng</label><input type="text" id="buyerName" value=""></div>
        <div class="field"><label data-i18n="lblAddress2">Địa chỉ</label><input type="text" id="buyerAddr" value=""></div>
        <div class="field"><label data-i18n="lblContact2">SĐT / Email</label><input type="text" id="buyerContact" value=""></div>
      </div>
    </div>

    <div>
      <div class="sectionTitle" data-i18n="secItems">Danh sách hàng hóa / dịch vụ</div>
      <table class="itemsTable">
        <thead>
          <tr><th style="width:36px">#</th><th data-i18n="thItemName">Tên hàng hóa/dịch vụ</th><th style="width:70px" data-i18n="thQty">SL</th>
            <th style="width:110px" data-i18n="thUnitPrice">Đơn giá</th><th style="width:110px" data-i18n="thAmount">Thành tiền</th><th style="width:36px"></th></tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="btnAddRow" id="btnAddRow" style="margin-top:8px" data-i18n="btnAddRow">+ Thêm dòng</button>
    </div>

    <div class="totalsBox">
      <div class="line"><span data-i18n="lblSubtotal">Tạm tính:</span><span id="subtotalVal">0 đ</span></div>
      <div class="line"><span><span data-i18n="lblTaxPrefix">Thuế VAT (</span><input type="number" class="taxInput" id="taxPct" value="10" min="0" max="100"><span data-i18n="lblTaxSuffix">%):</span></span><span id="taxVal">0 đ</span></div>
      <div class="line grand"><span data-i18n="lblGrandTotal">Tổng cộng:</span><span id="grandTotalVal">0 đ</span></div>
    </div>

  </div>

  <!-- vùng chuyên để in — build lại toàn bộ dưới dạng layout in ấn sạch sẽ khi bấm In -->
  <div id="printArea">
    <div class="printDoc" id="printDoc"></div>
  </div>
</main>

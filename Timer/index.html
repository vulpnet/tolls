<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer / Pomodoro</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --danger:#c03a3a;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --danger:#f3b0b0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tabs button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;overflow:auto;padding:24px 18px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px;align-items:center}
  .section{display:none;flex-direction:column;gap:18px;align-items:center;width:100%}
  .section.active{display:flex}

  .clockDisplay{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
  .clockDisplay.warn{color:var(--danger)}

  .presetRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .presetRow button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  .presetRow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .customRow{display:flex;gap:10px;align-items:center}
  .customRow input[type=number]{width:70px;padding:8px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:14px;text-align:center}
  .customRow label{color:var(--muted);font-size:12px}

  .controlRow{display:flex;gap:10px}
  .controlRow button{padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
  #btnStart{background:var(--accent);color:#fff}
  #btnPause{background:var(--panel);border:1px solid var(--border);color:var(--text)}
  #btnReset{background:var(--panel);border:1px solid var(--border);color:var(--text)}
  button:disabled{opacity:.5;cursor:default}

  .pomoStatus{font-size:14px;color:var(--muted);text-align:center}
  .pomoStatus b{color:var(--accent)}
  .pomoCount{display:flex;gap:6px}
  .pomoCount .dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
  .pomoCount .dot.done{background:var(--accent)}

  .hint{color:var(--muted);font-size:12px;text-align:center}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">⏱️ Timer / Pomodoro</h1>
  <div class="tabs">
    <button id="tabTimer" class="active" data-i18n="tabTimer">Đếm ngược tự do</button>
    <button id="tabPomo" data-i18n="tabPomo">🍅 Pomodoro</button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- TIMER TỰ DO -->
    <div class="section active" id="timerSection">
      <div class="clockDisplay" id="timerDisplay">05:00</div>
      <div class="presetRow" id="timerPresets">
        <button data-sec="60" data-i18n="preset1">1 phút</button>
        <button data-sec="300" class="active" data-i18n="preset5">5 phút</button>
        <button data-sec="600" data-i18n="preset10">10 phút</button>
        <button data-sec="900" data-i18n="preset15">15 phút</button>
        <button data-sec="1800" data-i18n="preset30">30 phút</button>
      </div>
      <div class="customRow">
        <label data-i18n="lblCustom">Tuỳ chỉnh:</label>
        <input type="number" id="customMin" value="5" min="0" max="180"> <span data-i18n="unitMin">phút</span>
        <input type="number" id="customSec" value="0" min="0" max="59"> <span data-i18n="unitSec">giây</span>
        <button id="btnSetCustom" data-i18n="btnSet" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer;font-size:12px">Đặt</button>
      </div>
      <div class="controlRow">
        <button id="btnStart" data-i18n="btnStart">▶ Bắt đầu</button>
        <button id="btnPause" disabled data-i18n="btnPause">⏸ Tạm dừng</button>
        <button id="btnReset" data-i18n="btnReset">↺ Reset</button>
      </div>
      <div class="hint" data-i18n="hintTimer">Hết giờ sẽ phát âm báo + hiện thông báo trên tab trình duyệt.</div>
    </div>

    <!-- POMODORO -->
    <div class="section" id="pomoSection">
      <div class="pomoStatus" id="pomoStatus">Sẵn sàng bắt đầu — <b>Làm việc</b> (25 phút)</div>
      <div class="clockDisplay" id="pomoDisplay">25:00</div>
      <div class="pomoCount" id="pomoCount"></div>
      <div class="customRow">
        <label data-i18n="lblWork">Làm việc:</label>
        <input type="number" id="pomoWorkMin" value="25" min="1" max="120"> <span data-i18n="unitMin2">phút</span>
        <label style="margin-left:10px" data-i18n="lblShortBreak">Nghỉ ngắn:</label>
        <input type="number" id="pomoBreakMin" value="5" min="1" max="60"> <span data-i18n="unitMin3">phút</span>
      </div>
      <div class="customRow">
        <label data-i18n="lblLongBreak">Nghỉ dài (sau mỗi 4 vòng):</label>
        <input type="number" id="pomoLongBreakMin" value="15" min="1" max="60"> <span data-i18n="unitMin4">phút</span>
      </div>
      <div class="controlRow">
        <button id="btnPomoStart" data-i18n="btnStart2">▶ Bắt đầu</button>
        <button id="btnPomoPause" disabled data-i18n="btnPause2">⏸ Tạm dừng</button>
        <button id="btnPomoReset" data-i18n="btnReset2">↺ Reset</button>
      </div>
      <div class="hint" data-i18n="hintPomo">Tự động chuyển Làm việc ↔ Nghỉ, phát âm báo khi chuyển giai đoạn.</div>
    </div>

  </div>
</main>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So sánh dữ liệu 2 Table</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#d8dce3; --text:#1c2128; --muted:#6b7280; --accent:#2563eb;
    --diff:#ffdddd; --diff-text:#9a3030;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171c; --panel:#1b1f26; --border:#30363d; --text:#e6e9ee; --muted:#9aa4b2; --accent:#5b9bff;
      --diff:#4a2222; --diff-text:#ff9b9b;
    }
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{font-size:16px;margin:0 0 4px;font-weight:600}
  .hint{font-size:12px;color:var(--muted);margin:0}

  main{flex:1;min-height:0;padding:12px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}

  .inputGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){.inputGrid{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;gap:6px;min-height:0}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
  textarea{width:100%;height:180px;resize:vertical;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font:13px ui-monospace,Consolas,monospace}

  .mappingGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){.mappingGrid{grid-template-columns:1fr}}
  .mapCard{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:10px 12px;
    display:flex;flex-direction:column;gap:8px}
  .mapRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mapRow label{font-size:12px;color:var(--muted);white-space:nowrap}
  select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:13px}
  .sumCols{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:90px;overflow:auto;padding:4px 2px}
  .sumCols label{display:flex;align-items:center;gap:5px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}

  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.act{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.08)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .status{font-size:13px;color:var(--muted)}
  .status.hasDiff{color:var(--diff-text);font-weight:600}

  .out{flex:1;min-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
  table{border-collapse:collapse;width:max-content;min-width:100%;font:13px ui-monospace,Consolas,monospace}
  th,td{padding:5px 10px;border:1px solid var(--border);text-align:right;white-space:nowrap}
  td:first-child,th:first-child{text-align:left}
  th{background:rgba(127,127,127,.12);color:var(--muted);font-size:12px;position:sticky;top:0}
  tr.diffRow td{background:var(--diff);color:var(--diff-text);font-weight:600}
  .empty{padding:24px;text-align:center;color:var(--muted)}

  /* ---- Nút copy cột/hàng dùng chung (table-copy.js) — hiện khi hover th/rownum ---- */
  th, td.rownum, td.rowh{ position:relative }
  .tblCopyBtn{position:absolute;top:2px;right:2px;display:none;padding:1px 4px;font-size:11px;
    line-height:1.4;border:1px solid var(--border);border-radius:4px;background:var(--panel);
    color:var(--text);cursor:pointer}
  th:hover .tblCopyBtn, td.rownum:hover .tblCopyBtn, td.rowh:hover .tblCopyBtn{display:inline-block}
  .tblCopyBtn:hover{filter:brightness(1.15)}
</style>
<script src="../assets/bg-sync.js"></script>
<script src="../assets/i18n-sync.js"></script>
<script src="../assets/table-copy.js"></script>
</head>
<body>

<header>
  <h1 data-i18n="title">📊 So sánh dữ liệu 2 Table (theo ngày)</h1>
  <p class="hint" data-i18n="hint">Dán dữ liệu từ Excel/SSMS (dòng đầu là tên cột, các cột cách nhau bằng Tab) vào 2 ô bên dưới, chọn cột Ngày + cột số cần SUM, rồi bấm So sánh. Dữ liệu chỉ xử lý trên trình duyệt, không gửi lên server.</p>
</header>

<main>
  <div class="inputGrid">
    <div class="panel">
      <h2 data-i18n="tableALabel">TABLE A</h2>
      <textarea id="inputA" data-i18n="inputPlaceholder" placeholder="Dán dữ liệu Table A (copy từ Excel/SSMS, dòng đầu là tên cột)..."></textarea>
    </div>
    <div class="panel">
      <h2 data-i18n="tableBLabel">TABLE B</h2>
      <textarea id="inputB" data-i18n="inputPlaceholder" placeholder="Dán dữ liệu Table B (copy từ Excel/SSMS, dòng đầu là tên cột)..."></textarea>
    </div>
  </div>

  <div class="mappingGrid">
    <div class="mapCard">
      <div class="mapRow">
        <label data-i18n="dayColumnLabel">Cột Ngày:</label>
        <select id="dayColA"></select>
      </div>
      <div class="mapRow">
        <label data-i18n="sumColumnLabel">Cột số (SUM):</label>
      </div>
      <div class="sumCols" id="sumColsA"></div>
    </div>
    <div class="mapCard">
      <div class="mapRow">
        <label data-i18n="dayColumnLabel">Cột Ngày:</label>
        <select id="dayColB"></select>
      </div>
      <div class="mapRow">
        <label data-i18n="sumColumnLabel">Cột số (SUM):</label>
      </div>
      <div class="sumCols" id="sumColsB"></div>
    </div>
  </div>

  <div class="actions">
    <button class="act primary" id="btnCompare" data-i18n="btnCompare">So sánh</button>
    <button class="act" id="btnClear" data-i18n="btnClear">Xoá</button>
    <span class="status" id="status"></span>
  </div>

  <div class="out" id="output"><div class="empty" data-i18n="emptyData">Chưa có kết quả so sánh</div></div>
</main>
